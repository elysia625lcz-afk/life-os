<head>

<style>
/* One screen, one decision. Neutral surfaces; color only for category dots and warnings. */
:root{
  --bg:#F5F5F2; --card:#FFFFFF; --soft:#EEEDE8; --ink:#1F1F1C; --sub:#6B6A64; --faint:#9C9B94; --line:#E2E1DB;
  --primary:#1F1F1C; --on-primary:#FFFFFF; --warn-bg:#FAEEDA; --warn:#854F0B; --bad:#A32D2D; --ok:#3B6D11;
  --r:14px; --font:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413; --card:#1E1E1C; --soft:#2A2A27; --ink:#EDECE6; --sub:#A3A29B; --faint:#77766F; --line:#33332F;
  --primary:#EDECE6; --on-primary:#141413; --warn-bg:#3A2A12; --warn:#F0B55A; --bad:#F09595; --ok:#97C459; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:16px;
  padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.date{font-size:17px;font-weight:600}
.sub{font-size:14px;color:var(--sub)}
.faint{font-size:13px;color:var(--faint)}
.iconbtn{border:0;background:transparent;color:var(--sub);font-size:14px;padding:6px 8px;border-radius:8px}
.iconbtn:hover{background:var(--soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--card);border-color:var(--ink);color:var(--ink);font-weight:600}
.focus{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.label{font-size:13px;color:var(--sub)}
.title{font-size:22px;font-weight:600;line-height:1.35;margin:0;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.note{font-size:15px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;width:100%}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:600}
.btn.small{width:auto;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);font-size:15px;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--faint)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.capture{margin-top:auto;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px}
.capture input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:6px 0;outline:none}
.capture button{border:0;border-radius:999px;background:var(--soft);padding:8px 14px;font-size:14px}
.empty{color:var(--sub);font-size:15px}
.ring{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;margin:16px auto 4px;position:relative}
.ring svg{position:absolute;inset:0}
.clock{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.center{text-align:center}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
textarea.f{resize:vertical;min-height:70px}
.fl{font-size:13px;color:var(--sub);margin:0 0 4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgb(0 0 0 / .4)}
.sheet .card{position:relative;background:var(--bg);width:min(560px,100%);max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px max(16px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:20px}}
.sheet h2{font-size:19px;margin:0}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);
  padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.search{display:flex;gap:8px}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--soft);border-radius:10px;padding:10px}
.err{color:var(--bad);font-size:14px;margin:0}
.daynav{display:flex;align-items:center;gap:6px}
.tlhead{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
.tl{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;position:relative}
.hours{position:relative}
.hours span{position:absolute;right:4px;font-size:11px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.lane{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:2px 6px;font-size:12px;line-height:1.3;overflow:hidden;border:0;text-align:left;color:#fff}
.blk.soft{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.blk b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:2;pointer-events:none}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.sum span{display:inline-flex;align-items:center;gap:6px}
</style>

<div class="wrap" id="app"><p class="empty">正在打开…</p></div>
<div class="sheet" id="sheet" hidden><div class="bg" data-act="close-sheet"></div><div class="card" id="sheet-card" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://snrlbgksmydgtwwasdgk.supabase.co";
const SUPABASE_KEY="sb_publishable_gfZJQR2lreNoQd_gl2DHFQ_IgcNf9o4"; // publishable: safe in a browser, data is guarded by row-level security
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

const AREAS=[["Co-op","#378ADD"],["课程","#1D9E75"],["生活","#BA7517"],["兼职","#D85A30"],["学习","#7F77DD"],["运动","#D4537E"],["其他","#888780"]];
const areaColor=a=>(AREAS.find(x=>x[0]===a)||[0,"#B4B2A9"])[1];
const ENERGY=[["high","充沛"],["mid","一般"],["low","累了"]];
const STATUS=[["todo","待办"],["inbox","收件箱"],["someday","以后再说"],["done","已完成"]];
const MINS=[5,10,15,20,25,30,45,60,90];
const DEFAULT_ACTIVITIES=[
 {title:"整理电阻、导线或工具",minutes:10,steps:["拿出一小盒电阻或一把散放的导线，只选其中一种","电阻按阻值或色环分；导线按长度或颜色分","常用的 330Ω、4.7kΩ 放到顺手的位置","剩下的放回原处，拍张照片方便下次找"],done_when:"只整理一个小盒或一个抽屉就算完成",caution:"不通电、不测电路、不顺手调试项目",tags:["整理"],weight:1.4},
 {title:"准备明天的午饭",minutes:12,steps:["先看冰箱里有没有熟食、米饭、鸡蛋","有熟食就分装进饭盒；没有就准备一个简单组合","把明天要用的饭盒、餐具、水杯放在一起","要冷藏的马上放回冰箱"],done_when:"明天少一个准备步骤就算完成",caution:"生肉海鲜放冰箱里解冻；熟食别在室温放太久",tags:["生活"],weight:1},
 {title:"叠衣服或启动洗衣机",minutes:8,steps:["有干净衣服：先叠最好叠的 5 件","有待洗衣服：分深浅色，检查口袋","按标签选洗涤程序","把取衣服的时间记一下"],done_when:"叠 5 件，或者启动一桶就算完成",caution:"睡前别启动需要你熬夜等的程序",tags:["生活"],weight:1},
 {title:"清理书桌表面",minutes:7,steps:["拿一个垃圾袋，先丢掉明显的垃圾","把杯子、餐具、包装拿出书桌","散落的工具和课程纸张各归一处","擦出一块明天能直接开工的桌面"],done_when:"清出能放电脑和本子的一块地方就算完成",caution:"不开电脑整理文件，不研究桌上翻出来的元件",tags:["整理"],weight:1},
 {title:"听熟悉的音乐，伸展一下",minutes:10,steps:["放一首听过的、节奏平稳的歌，不刷推荐","慢慢活动肩膀、手腕和脖子","做几次胸背伸展和站姿小腿伸展","最后安静站一分钟"],done_when:"大概两首歌的时间就算完成",caution:"不追求拉到疼，不做高强度",tags:["运动"],weight:1}
];

const S={user:null,tasks:[],acts:[],settings:null,session:null,energy:load("energy","mid"),pick:0,view:"home",
  all:load("allFilter",{q:"",status:"todo",area:"",sort:"due"}),cal:{day:null},rec:{},loaded:false,busy:false,revision:0};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(k,d){try{return JSON.parse(localStorage.getItem("los."+k))??d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem("los."+k,JSON.stringify(v));}catch(e){}}
const userKey=k=>S.user.id+"."+k;

/* ---------- time ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d+n);return ymd(x);};
const WD=["日","一","二","三","四","五","六"];
const hm=t=>{if(!t)return null;const [h,m]=String(t).split(":").map(Number);return h*60+m;};
function sleepAt(){ // bedtime in the current cycle, starting at day_start
  const st=S.settings||{}; const sl=hm(st.sleep_time)??1410, ds=hm(st.day_start)??480;
  const n=new Date(); const b=new Date(n.getFullYear(),n.getMonth(),n.getDate(),Math.floor(sl/60),sl%60);
  const beforeDayStart=n.getHours()*60+n.getMinutes()<ds;
  b.setDate(b.getDate()+(sl<ds?1:0)-(beforeDayStart?1:0));
  return b;
}
const minsLeftToSleep=()=>Math.round((sleepAt()-new Date())/60000);
const fmtMin=m=>m>=60?(Math.floor(m/60)+" 小时"+(m%60?" "+m%60+" 分":"")):m+" 分钟";
function dueText(t){
  if(!t.due_at) return "";
  const h=(new Date(t.due_at)-new Date())/36e5;
  const d=new Date(t.due_at);
  if(h<0) return "已过截止时间";
  if(ymd(d)===today()) return d.getHours()>=17?"今晚截止":"今天截止";
  if(ymd(d)===addDays(today(),1)) return "明天截止";
  const days=Math.ceil(h/24); return days<=7?days+" 天后截止":(d.getMonth()+1)+"月"+d.getDate()+"日截止";
}

/* ---------- recommendation (rules only, instant) ---------- */
function rank(){
  const now=new Date(), td=today(), e=S.energy, out=[];
  for(const t of S.tasks){
    if(!["todo","doing","inbox"].includes(t.status)) continue;
    if(t.plan_date&&t.plan_date>td) continue;
    let s=0, why="";
    if(t.due_at){const h=(new Date(t.due_at)-now)/36e5;
      if(h<0){s+=95;why="已过截止时间";} else if(h<12){s+=90;why=dueText(t);} else if(h<36){s+=60;why=dueText(t);} else if(h<72){s+=35;why=dueText(t);} }
    if(t.plan_date===td){s+=40;why=why||"排在今天";}
    else if(t.plan_date&&t.plan_date<td){s+=30;why=why||"之前没做完";}
    if(t.status==="doing"||t.next_step){s+=15;why=why||"接着上次";}
    s+=[0,25,15,8,0][t.quadrant||0];
    const urgent=t.due_at&&(new Date(t.due_at)-now)<12*36e5;
    if(e==="low"&&!urgent){ if((t.est_min||30)>30) s-=40; if(t.energy==="high") s-=30; if(t.energy==="low") s+=15; }
    if(e==="mid"&&(t.est_min||0)>90) s-=10;
    if(e==="high"&&t.energy==="high") s+=10;
    if((t.quadrant===1||t.quadrant===2)&&(now-new Date(t.updated_at))>7*864e5){s+=10;why=why||"放了一阵子了，要不要看看";}
    if(t.status==="inbox"&&!t.due_at&&!t.plan_date) s-=5;
    out.push({kind:"task",item:t,score:s,why});
  }
  if(e!=="high") for(const a of S.acts){ if(!a.active) continue;
    out.push({kind:"act",item:a,score:(e==="low"?55:12)*(a.weight||1),why:e==="low"?"累了，做点不费脑的":"换换脑子"}); }
  return out.sort((a,b)=>b.score-a.score);
}
function todayOpen(){ return S.tasks.filter(t=>t.plan_date===today()&&!["done","dropped","someday"].includes(t.status)); }

/* ---------- data ---------- */
async function q(p,label){
  const user=S.user, r=await p;
  if(S.user!==user) throw new Error("Session changed");
  if(r.error){ toast((label||"没保存上")+"："+(r.error.message||"出错")); throw r.error; }
  return r.data;
}
async function loadAll(){
  const user=S.user, uid=user.id, revision=S.revision;
  let [tasks,acts,settings,sessions,caps]=await Promise.all([
    q(sb.from("tasks").select("*").neq("status","dropped").order("created_at"),"读取失败"),
    q(sb.from("activities").select("*").order("created_at"),"读取失败"),
    q(sb.from("settings").select("*").maybeSingle(),"读取失败"),
    q(sb.from("sessions").select("*").is("ended_at",null).order("started_at",{ascending:false}).limit(1),"读取失败"),
    q(sb.from("captures").select("*").is("processed_at",null).order("created_at"),"读取失败")]);
  if(S.user!==user) return;
  if(!settings){
    await q(sb.from("settings").upsert({user_id:uid},{onConflict:"user_id",ignoreDuplicates:true}));
    settings=await q(sb.from("settings").select("*").single(),"读取失败");
  }
  if(S.user!==user) return;
  if(!acts.length){
    await q(sb.rpc("seed_web_activities",{p_cards:DEFAULT_ACTIVITIES}),"活动卡没建好");
    acts=await q(sb.from("activities").select("*").order("created_at"),"读取失败");
  }
  for(const c of caps){ // Siri/watch captures become inbox tasks
    if(S.user!==user) return;
    const external_id="capture:"+c.id;
    const inserted=await q(sb.from("tasks").upsert({user_id:uid,external_id,title:c.text.slice(0,300),status:"inbox",source:c.source||"siri"},
      {onConflict:"user_id,external_id",ignoreDuplicates:true}).select());
    const t=inserted[0]||await q(sb.from("tasks").select("*").eq("external_id",external_id).single());
    if(S.user!==user) return;
    await q(sb.from("captures").update({processed_at:new Date().toISOString(),task_id:t.id}).eq("id",c.id));
    if(t.status!=="dropped"&&!tasks.some(row=>row.id===t.id)) tasks.push(t);
  }
  if(S.user!==user||S.revision!==revision) return;
  Object.assign(S,{tasks,acts,settings,session:sessions[0]||null});
  S.loaded=true;
}
async function readAll(){
  const user=S.user;
  if(!user||S.loading===user) return;
  S.loading=user;
  try{ await loadAll(); }
  finally{ if(S.loading===user) S.loading=null; }
}
async function refresh(){
  if(!S.loaded||S.busy||S.loading||S.restoring) return;
  const user=S.user;
  try{
    await readAll();
    if(S.user!==user||S.busy) return;
    if(S.view==="cal"&&S.rec.day===calendarDay()&&!S.rec.loading&&!S.rec.error) {
      await loadRecord(calendarDay(),true);
    }else render();
  }catch(e){}
}
function beginWrite(){
  if(S.busy) return false;
  S.busy=true; S.revision++;
  return true;
}
function patchLocal(id,data){ const t=S.tasks.find(x=>x.id===id); if(t) Object.assign(t,data); }
async function updTask(id,data,label){ const r=await q(sb.from("tasks").update(data).eq("id",id).select().single(),label); patchLocal(id,r); return r; }
async function createTask(data,draftType){
  const key=userKey("pendingTask."+draftType), previous=load(key,null);
  // done_at is assigned at submit time, so it is not part of the draft identity.
  const signature=JSON.stringify({...data,done_at:undefined});
  const id=previous?.signature===signature?previous.id:crypto.randomUUID();
  save(key,{id,signature});
  const inserted=await q(sb.from("tasks").upsert({...data,id,user_id:S.user.id},{onConflict:"id",ignoreDuplicates:true}).select());
  const t=inserted[0]||await q(sb.from("tasks").select("*").eq("id",id).single());
  if(S.tasks.some(row=>row.id===id)) patchLocal(id,t);
  else if(t.status!=="dropped") S.tasks.push(t);
  save(key,null);
}

/* ---------- toast & sheet ---------- */
let tt=0;
function toast(msg,action){ const el=$("#toast"); el.innerHTML=""; const s=document.createElement("span"); s.textContent=msg; el.append(s);
  if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{el.hidden=true;action.fn();};el.append(b);}
  el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,action?6000:2600); }
function openSheet(html,panel=null){ $("#sheet-card").innerHTML=html; $("#sheet").hidden=false;
  $("#sheet-card").scrollTop=0; save(userKey("panel"),panel); }
function closeSheet(){ $("#sheet").hidden=true; $("#sheet-card").innerHTML=""; if(S.user) save(userKey("panel"),null); }
function changeView(view){
  save(userKey("scroll."+S.view),scrollY);
  S.view=view; save(userKey("view"),view); render();
  scrollTo(0,load(userKey("scroll."+view),0));
}

/* ---------- views ---------- */
function render(){
  const app=$("#app");
  if(!S.user){ stopTick(); app.innerHTML=loginView(); return; }
  if(!S.loaded){ app.innerHTML=S.loadError?`<div style="margin:auto 0;display:flex;flex-direction:column;gap:12px"><p class="note">没读到你的数据，可能是网络不稳。</p><button class="btn primary" data-act="retry">重试</button><button class="btn" data-act="logout">退出登录</button></div>`:`<p class="empty">正在读取…</p>`; return; }
  if(S.session){ app.innerHTML=timerView(); startTick(); return; }
  stopTick();
  app.innerHTML=S.view==="all"?allView():S.view==="cal"?calView():homeView();
  if(S.view==="cal") ensureRecord();
}
function loginView(){
  return `<div style="margin:auto 0;display:flex;flex-direction:column;gap:12px">
    <h1 class="title">Life OS</h1><p class="sub">用你注册时的邮箱和密码登录。</p>

/* ---------- calendar: plan vs record ---------- */
const APP_COLORS={"抖音":"#D4537E","小红书":"#E24B4A","B站":"#378ADD","YouTube":"#A32D2D","TikTok":"#444441"};
const appColor=a=>Object.hasOwn(APP_COLORS,a)?APP_COLORS[a]:"#888780";
const dayStart=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const isoDow=s=>{const g=dayStart(s).getDay();return g===0?7:g;};
const calendarDay=()=>S.cal.day||today();
function ensureRecord(){
  const day=calendarDay();
  if(S.rec.day!==day) void loadRecord(day);
}
async function loadRecord(day,keepRows=false){
  const si=dayStart(day).toISOString(), ei=dayStart(addDays(day,1)).toISOString();
  const request=keepRows?{...S.rec,loading:true}:{day,loading:true};
  S.rec=request;
  try{
    const [usage,sessions,events]=await Promise.all([
      q(sb.from("app_usage").select("*").lt("started_at",ei).or(`ended_at.gt.${si},ended_at.is.null`).order("started_at"),"读取记录失败"),
      q(sb.from("sessions").select("*").lt("started_at",ei).or(`ended_at.gt.${si},ended_at.is.null`).order("started_at"),"读取记录失败"),
      q(sb.from("events").select("*"),"读取日程失败")]);
    Object.assign(request,{usage,sessions,events});
  }catch(err){ request.error=true; }
  request.loading=false;
  if(S.rec!==request) return;
  if(S.view==="cal") render();
}
const wallMinutes=t=>t.getHours()*60+t.getMinutes();
function recordSpan(start,end,d0,d1){
  const from=Math.max(Date.parse(start),+d0), to=Math.min(+end,+d1);
  if(!(to>from)) return null;
  const s=wallMinutes(new Date(from)), e=to===+d1?1440:wallMinutes(new Date(to));
  return {s,e:Math.max(s,e),minutes:(to-from)/60000};
}
function calView(){
  const day=calendarDay(), record=S.rec;
  const ready=record.day===day&&!!record.usage&&!record.error;
  const failed=record.day===day&&record.error;
  const d0=dayStart(day), d1=dayStart(addDays(day,1)), now=new Date();
  const plan=[], unscheduled=[];
  for(const t of S.tasks){ if(t.plan_date!==day||t.status==="dropped") continue;
    if(t.plan_start){ const s=hm(t.plan_start); plan.push({s,e:s+(t.est_min||30),title:t.title,color:areaColor(t.area),id:t.id,done:t.status==="done"}); }
    else unscheduled.push(t); }
  for(const ev of (ready?record.events:[])){
    const on=ev.on_date===day||(ev.repeat_days&&ev.repeat_days.includes(isoDow(day))&&(!ev.valid_from||ev.valid_from<=day)&&(!ev.valid_until||day<=ev.valid_until));
    if(on) plan.push({s:hm(ev.start_time),e:hm(ev.end_time),title:ev.title,color:areaColor(ev.area),fixed:true}); }
  const rec=[], perApp=new Map(); let fun=0, work=0;
  if(ready){
    for(const u of record.usage){ const cap=Date.parse(u.started_at)+3*36e5, en=Math.min(u.ended_at?Date.parse(u.ended_at):+now,cap);
      const span=recordSpan(u.started_at,en,d0,d1); if(!span) continue;
      rec.push({...span,title:u.app,color:appColor(u.app),open:!u.ended_at&&day===today()&&now<cap});
      perApp.set(u.app,(perApp.get(u.app)||0)+span.minutes); fun+=span.minutes; }
    for(const x of record.sessions){ const en=x.ended_at?Date.parse(x.ended_at):+now;
      const span=recordSpan(x.started_at,en,d0,d1); if(!span) continue;
      const tk=S.tasks.find(t=>t.id===x.task_id), ac=S.acts.find(a=>a.id===x.activity_id);
      rec.push({...span,title:tk?tk.title:ac?ac.title:"做事",soft:true}); work+=span.minutes; }
  }
  const all=[...plan,...rec]; const lo=Math.min(7,...all.map(b=>Math.floor(b.s/60))), hi=Math.max(24,...all.map(b=>Math.ceil(b.e/60)));
  const H=40, top=lo*60, px=m=>(m-top)/60*H, height=(hi-lo)*H;
  const blk=b=>{const y=px(b.s), h=Math.max(16,px(b.e)-y-2); return `<div class="blk${b.soft||b.fixed?" soft":""}" style="top:${y}px;height:${h}px;${b.soft||b.fixed?"":"background:"+b.color}${b.fixed?";box-shadow:inset 3px 0 0 "+b.color:""}"><b>${esc(b.title)}${b.open?" · 进行中":""}</b>${h>30?`<span>${pad(Math.floor(b.s/60)%24)}:${pad(b.s%60)}–${pad(Math.floor(b.e/60)%24)}:${pad(b.e%60)} · ${Math.round(b.minutes??b.e-b.s)} 分</span>`:""}</div>`;};
  let hrs=""; for(let h=lo+1;h<hi;h++) hrs+=`<span style="top:${(h-lo)*H}px">${pad(h%24)}:00</span>`;
  const nowM=wallMinutes(now), showNow=day===today()&&nowM>=top&&nowM<=hi*60;
  const dd=dayStart(day);
  return `<div class="top"><button class="iconbtn" data-act="home">‹ 返回</button>
      <span class="daynav"><button class="iconbtn" data-act="cal-day" data-v="-1" aria-label="前一天">‹</button><span class="date">${dd.getMonth()+1}月${dd.getDate()}日 周${WD[dd.getDay()]}</span><button class="iconbtn" data-act="cal-day" data-v="1" aria-label="后一天">›</button></span>
      ${day!==today()?`<button class="iconbtn" data-act="cal-day" data-v="0">今天</button>`:"<span></span>"}</div>
    <div class="sum">${ready?`<span>娱乐 <b>${fmtMin(Math.round(fun))}</b></span>${[...perApp].sort((a,b)=>b[1]-a[1]).map(([a,m])=>`<span><i class="dot" style="background:${appColor(a)}"></i>${esc(a)} ${Math.round(m)} 分</span>`).join("")}<span>做事 <b>${fmtMin(Math.round(work))}</b></span>`:failed?`<span class="sub">没读到这一天的记录。</span><button class="btn small" data-act="retry-record">重试</button>`:`<span class="sub">正在读取这一天的记录…</span>`}</div>
    ${unscheduled.length?`<div><p class="label" style="margin:0 0 4px">计划了、没定时间</p><div class="list">${unscheduled.map(t=>`<button class="row${t.status==="done"?" done":""}" data-act="edit" data-id="${t.id}"><span class="dot" style="background:${areaColor(t.area)}"></span><span class="t">${esc(t.title)}</span><span class="faint">${t.est_min?fmtMin(t.est_min):""}</span></button>`).join("")}</div></div>`:""}
    <div class="tlhead"><span></span><span>计划</span><span>记录</span></div>
    <div class="tl" style="height:${height}px">
      <div class="hours">${hrs}</div>
      <div class="lane">${plan.map(blk).join("")}${showNow?`<div class="nowline" style="top:${px(nowM)}px"></div>`:""}</div>
      <div class="lane">${rec.map(blk).join("")}${showNow?`<div class="nowline" style="top:${px(nowM)}px"></div>`:""}</div>
    </div>
    ${ready&&!rec.length?`<p class="faint">这一天还没有记录。用计时器做事，或者装好快捷指令后刷视频，这里就会出现。</p>`:""}`;
}

      <div class="chips" id="s-min">${[15,20,30,45,60].map(m=>`<button type="button" class="chip" data-m="${m}" aria-pressed="${m===20}">${m} 分钟</button>`).join("")}</div>
      <div class="chips" id="s-day"><button type="button" class="chip" data-d="1" aria-pressed="true">明天</button><button type="button" class="chip" data-d="2">后天</button><button type="button" class="chip" data-d="0">先不排</button></div></div>`}
    <button class="opt" data-c="more">再做 20 分钟</button>
    <div id="s-warn"></div>
    <div class="chips" style="align-items:center"><span class="sub">这次感觉怎么样？</span><button type="button" class="chip" data-fb="5">👍</button><button type="button" class="chip" data-fb="1">👎</button></div>
    <p class="err" id="s-err"></p>
    <button class="btn primary" id="s-go" disabled>确定</button>
    <button class="btn" data-act="close-sheet">回去接着做</button>`,{type:"stop",id:s.id});
  const card=$("#sheet-card"); let mins=draft.mins??20, day=draft.day??1, fb=draft.fb??null;
  const go=$("#s-go"), noteInput=$("#s-note"), nextInput=$("#s-next"), errorText=$("#s-err");
  const keep=()=>save(key,{note:noteInput.value,next:nextInput?.value||"",choice,mins,day,fb});
  noteInput.oninput=keep; if(nextInput) nextInput.oninput=keep;
  const moreMinutes=()=>Math.min(600,Math.max(s.planned_min,Math.ceil((Date.now()-Date.parse(s.started_at))/60000))+20);
  const pickChoice=()=>{ card.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===choice));
    if($("#later")) $("#later").hidden=choice!=="later";
    const end=new Date(Date.parse(s.started_at)+moreMinutes()*60000), sl=sleepAt();
    $("#s-warn").innerHTML=choice==="more"&&end>sl?`<div class="warnbox">再做 20 分钟会到 ${pad(end.getHours())}:${pad(end.getMinutes())}，比你定的睡觉时间晚 ${Math.round((end-sl)/60000)} 分钟。</div>`:"";
    go.disabled=!choice; };
  card.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ if(!S.busy){ choice=b.dataset.c; pickChoice(); keep(); } });
  const mark=(name,value)=>card.querySelectorAll("[data-"+name+"]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset[name]===value));
  card.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{if(!S.busy){mins=+b.dataset.m;mark("m",mins);keep();}});
  card.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(!S.busy){day=+b.dataset.d;mark("d",day);keep();}});
  card.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{if(!S.busy){fb=+b.dataset.fb;mark("fb",fb);keep();}});
  choice=draft.choice??null; pickChoice(); mark("m",mins); mark("d",day); mark("fb",fb);
  go.onclick=async()=>{ if(!choice||!beginWrite()) return;
    go.disabled=true; noteInput.disabled=true; if(nextInput) nextInput.disabled=true;
    const note=noteInput.value.trim();
    try{
      if(choice==="more"){
        S.session=await q(sb.from("sessions").update({planned_min:moreMinutes()}).eq("id",s.id).is("ended_at",null).select().single());
        save(key,{note:noteInput.value,next:nextInput?.value||""}); closeSheet(); render(); return;
      }
      const later=choice==="later", date=later&&day?addDays(today(),day):null;
      const result=await q(sb.rpc("finish_web_session",{p_id:s.id,p_outcome:choice,p_note:note,
        p_next:later?nextInput.value.trim():"",p_min:later?mins:null,p_date:date,p_rating:fb}));
      if(result.task) patchLocal(result.task.id,result.task);
      if(result.activity&&tg.act) Object.assign(tg.act,result.activity);
      if(result.session.outcome==="done"){
        toast(isAct?"做完了":"完成了：「"+tg.title+"」");
      } else {
        const planned=result.task?.plan_date;
        toast(planned?"排到"+(planned===addDays(today(),1)?"明天":"后天")+"了，下次从这里接着做":"存好了，下次从这里接着做");
      }
      save(key,null); S.session=null; S.rec={}; S.pick=0; closeSheet(); render();
    }catch(e){ go.disabled=false; noteInput.disabled=false; if(nextInput) nextInput.disabled=false; errorText.textContent="没保存上，网络好了再点一次。"; }
    finally{ S.busy=false; } };
}
function actSheet(a){
  openSheet(`<h2>${esc(a.title)} · ${a.minutes} 分钟</h2>
    <ol class="steps">${(a.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    ${a.done_when?`<p class="sub">${esc(a.done_when)}</p>`:""}${a.caution?`<p class="faint">${esc(a.caution)}</p>`:""}
    <button class="btn primary" data-act="act-start" data-id="${a.id}">开始 · ${a.minutes} 分钟</button>
    <button class="btn" data-act="close-sheet">先不</button>`,{type:"activity",id:a.id});
}
function replanSheet(){
  const left=Math.max(0,minsLeftToSleep()), ranked=rank().filter(r=>r.kind==="task").map(r=>r.item.id);
  const td=today(), dueToday=t=>t.due_at&&ymd(new Date(t.due_at))===td;
  const key=userKey("replanDraft."+td), draft=load(key,{});
  const open=todayOpen().sort((a,b)=>ranked.indexOf(a.id)-ranked.indexOf(b.id));
  let used=open.reduce((sum,t)=>sum+(dueToday(t)?t.est_min||30:0),0);
  const plan=open.map(t=>{ const m=t.est_min||30, fixed=dueToday(t);
    if(fixed) return {t,keep:true,fixed};
    const keep=draft[t.id]??(used+m<=left); if(keep) used+=m; return {t,keep,fixed}; });
  openSheet(`<h2>今天排不下了</h2><p class="sub">睡前还有 ${fmtMin(left)}。这样挪就能做完：</p>
    <div class="list" id="rp">${plan.map((p,i)=>`<button class="row" data-i="${i}"><span class="dot" style="background:${areaColor(p.t.area)}"></span><span class="t">${esc(p.t.title)}</span><span class="sub" data-lab>${p.keep?"今天做":"挪到明天"}</span></button>`).join("")}</div>
    <p class="faint">今天截止的不动。挪走的明天会排在前面。点某一行可以自己改。</p>
    <button class="btn primary" id="rp-go">就这样排</button><button class="btn" data-act="close-sheet">先不改</button>`,{type:"replan",day:td});
  $("#rp").querySelectorAll("[data-i]").forEach(b=>{const p=plan[+b.dataset.i]; b.disabled=!!p.fixed;
    b.onclick=()=>{ if(S.busy) return; p.keep=!p.keep; b.querySelector("[data-lab]").textContent=p.keep?"今天做":"挪到明天";
      draft[p.t.id]=p.keep; save(key,draft); }; });
  $("#rp-go").onclick=async()=>{ if(!beginWrite()) return;
    const go=$("#rp-go"); go.disabled=true;
    try{
      const move=plan.filter(p=>!p.keep).map(p=>p.t.id);
      if(move.length){
        const updated=await q(sb.from("tasks").update({plan_date:addDays(td,1)}).in("id",move).eq("plan_date",td).select());
        updated.forEach(t=>patchLocal(t.id,t));
      }
      save(key,null); closeSheet(); toast("排好了"); render();
    }catch(e){ go.disabled=false; }finally{ S.busy=false; } };
}
function settingsSheet(){
  const st=S.settings||{}, key=userKey("settingsDraft"), draft=load(key,{});
  openSheet(`<h2>设置</h2>
    <div class="grid2"><div><p class="fl">一天从几点开始</p><input class="f" type="time" id="st-start" value="${esc(draft.start??(st.day_start||"08:00").slice(0,5))}"></div>
    <div><p class="fl">几点睡觉</p><input class="f" type="time" id="st-sleep" value="${esc(draft.sleep??(st.sleep_time||"23:30").slice(0,5))}"></div></div>
    <button class="btn" id="st-save">保存作息</button>
    <div style="border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px">
      <p class="fl">手机快捷指令的钥匙</p>
      <p class="sub">给 Siri、手表、耳机记东西用，不是你的密码。${st.device_key_hash?"已经生成过。重新生成后，旧钥匙立刻失效。":"还没生成。"}</p>
      <div id="keyout"></div><button class="btn" id="st-key">${st.device_key_hash?"重新生成钥匙":"生成钥匙"}</button></div>
    <button class="btn" id="st-out">退出登录</button>`,{type:"settings"});
  const start=$("#st-start"), sleep=$("#st-sleep"), saveButton=$("#st-save"), keyButton=$("#st-key"), keyout=$("#keyout");
  start.oninput=sleep.oninput=()=>save(key,{start:start.value,sleep:sleep.value});
  saveButton.onclick=async()=>{
    if(!start.value||!sleep.value||!beginWrite()) return;
    start.disabled=sleep.disabled=saveButton.disabled=true;
    try{
      S.settings=await q(sb.from("settings").update({day_start:start.value,sleep_time:sleep.value}).eq("user_id",S.user.id).select().single());
      save(key,null); toast("作息保存了"); render();
    }catch(e){}finally{ start.disabled=sleep.disabled=saveButton.disabled=false; S.busy=false; }
  };
  keyButton.onclick=async()=>{
    if(!beginWrite()) return;
    const user=S.user;
    keyButton.disabled=true;
    try{
      const raw=crypto.getRandomValues(new Uint8Array(24));
      const hex=bytes=>[...bytes].map(b=>b.toString(16).padStart(2,"0")).join("");
      const secret=hex(raw), hash=hex(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(secret))));
      if(S.user!==user) return;
      S.settings=await q(sb.from("settings").update({device_key_hash:hash}).eq("user_id",user.id).select().single());
      keyout.innerHTML=`<div class="keybox" id="kb">${secret}</div><p class="faint">只显示这一次。导入快捷指令时粘贴进去。</p><button class="btn small" id="kc">复制</button>`;
      $("#kc").onclick=()=>navigator.clipboard.writeText(secret).then(()=>toast("复制了"),()=>{const r=document.createRange();r.selectNodeContents($("#kb"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("已选中，手动复制");});
    }catch(e){}finally{ keyButton.disabled=false; S.busy=false; }
  };
  $("#st-out").onclick=logout;
}

/* ---------- actions ---------- */
async function startSession(data){
  if(S.session||!beginWrite()) return;
  try{
    const result=await q(sb.rpc("start_web_session",{p_task:data.task_id??null,p_activity:data.activity_id??null,p_min:data.planned_min}),"没开始成");
    S.session=result.session;
    if(result.task){
      if(S.tasks.some(t=>t.id===result.task.id)) patchLocal(result.task.id,result.task);
      else if(result.task.status!=="dropped") S.tasks.push(result.task);
    }
    closeSheet(); render();
  }catch(e){} finally{ S.busy=false; }
}
async function logout(){
  if(!beginWrite()) return;
  try{
    const {error}=await sb.auth.signOut();
    if(error) toast("没退出登录："+error.message);
  }finally{ S.busy=false; }
}
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(S.busy) return;
  if(a==="close-sheet") return closeSheet();
  if(a==="retry") return boot();
  if(a==="logout") return logout();
  if(a==="energy"){ S.energy=el.dataset.v; save("energy",S.energy); S.pick=0; return render(); }
  if(a==="next"){ S.pick++; return render(); }
  if(a==="all"||a==="home") return changeView(a);
  if(a==="cal"){ S.rec={}; return changeView("cal"); }
  if(a==="retry-record") return loadRecord(calendarDay());
  if(a==="cal-day"){ const v=+el.dataset.v; S.cal.day=v===0?null:addDays(calendarDay(),v); save(userKey("calendarDay"),S.cal.day); render(); return; }
  if(a==="settings") return settingsSheet();
  if(a==="replan") return replanSheet();
  if(a==="new") return editSheet(null);
  if(a==="edit") return editSheet(S.tasks.find(t=>t.id===id));
  if(a==="start"){ const t=S.tasks.find(x=>x.id===id); return startSession({task_id:id,planned_min:Math.min(600,t.est_min||25)}); }
  if(a==="act-open") return actSheet(S.acts.find(x=>x.id===id));
  if(a==="act-start"){ const ac=S.acts.find(x=>x.id===id); return startSession({activity_id:id,planned_min:Math.max(1,Math.min(600,ac.minutes||10))}); }
  if(a==="adj"){
    if(!S.session||!beginWrite()) return;
    const s=S.session, m=Math.max(1,Math.min(600,s.planned_min+(+el.dataset.v)));
    try{ S.session=await q(sb.from("sessions").update({planned_min:m}).eq("id",s.id).is("ended_at",null).select().single()); startTick(); }
    catch(e){}finally{ S.busy=false; }
    return;
  }
  if(a==="stop") return stopSheet();
  if(a==="fstatus"||a==="farea"||a==="fsort"){ S.all[{fstatus:"status",farea:"area",fsort:"sort"}[a]]=el.dataset.v; save("allFilter",S.all); return render(); }
  if(a==="del"){ const t=S.tasks.find(x=>x.id===id); const prev=t.status;
    if(!beginWrite()) return;
    try{ await updTask(id,{status:"dropped"}); save(userKey("taskDraft."+id),null); closeSheet(); render();
      toast("删掉了「"+t.title+"」",{label:"撤销",fn:async()=>{
        if(!beginWrite()) return;
        try{
          const restored=await updTask(id,{status:prev});
          if(!S.tasks.some(row=>row.id===id)) S.tasks.push(restored);
          render();
        }catch(e){}finally{ S.busy=false; }
      }});
    }catch(e){}finally{ S.busy=false; } return; }
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id==="cap"){ ev.preventDefault(); const inp=$("#capin"), v=inp.value.trim(); if(!v||!beginWrite()) return;
    const btn=ev.target.querySelector('[type="submit"]'); inp.disabled=true; btn.disabled=true;
    try{ await createTask({title:v.slice(0,300),status:"inbox",source:"web"},"capture"); save("capDraft",""); toast("记下了，在“全部 › 收件箱”里"); render(); }
    catch(e){ inp.disabled=false; btn.disabled=false; }finally{ S.busy=false; } }
  if(ev.target.id==="login"){
    ev.preventDefault(); const btn=ev.target.querySelector('[type="submit"]'); if(btn.disabled) return;
    btn.disabled=true;
    try{
      const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
      if(r.error) throw r.error;
    }catch(error){ const err=$("#lerr"); if(err) err.textContent="登录没成功："+(error.message.includes("Invalid")?"邮箱或密码不对":error.message); }
    finally{ btn.disabled=false; }
  }
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="capin") save("capDraft",ev.target.value);
  if(ev.target.id==="allq"){ S.all.q=ev.target.value; save("allFilter",S.all); const pos=ev.target.selectionStart; render(); const n=$("#allq"); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!S.busy&&!$("#sheet").hidden) closeSheet(); });
addEventListener("scroll",()=>{ if(S.loaded&&!S.session&&!S.restoring) save(userKey("scroll."+S.view),scrollY); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
setInterval(()=>{ if(document.visibilityState==="visible"&&!S.session&&$("#sheet").hidden) refresh(); },60000);

/* ---------- boot ---------- */
// Never await Supabase calls inside onAuthStateChange: supabase-js holds a lock there and the calls deadlock.
async function boot(){
  if(!S.user||S.loading===S.user) return;
  const user=S.user;
  S.loadError=false; render();
  try{ await readAll(); }catch(e){ if(S.user===user) S.loadError=true; }
  if(S.user!==user) return;
  render();
  if(!S.loaded) return;
  S.restoring=true;
  scrollTo(0,load(userKey("scroll."+S.view),0));
  requestAnimationFrame(()=>{ S.restoring=false; });
  const card=new URLSearchParams(location.search).get("card"); // opened from a Shortcut nudge
  if(card){ const a=S.acts.find(x=>x.id===card); if(a) actSheet(a); else { const t=S.tasks.find(x=>x.id===card); if(t) editSheet(t); } history.replaceState(null,"",location.pathname); return; }
  const panel=load(userKey("panel"),null);
  if(panel?.type==="stop"&&S.session?.id===panel.id) stopSheet();
  if(panel?.type==="task"&&!S.session){
    const task=panel.id?S.tasks.find(t=>t.id===panel.id):null;
    if(task||!panel.id) editSheet(task);
  }
  if(panel?.type==="settings"&&!S.session) settingsSheet();
  if(panel?.type==="replan"&&panel.day===today()&&!S.session) replanSheet();
  if(panel?.type==="activity"&&!S.session){
    const activity=S.acts.find(a=>a.id===panel.id);
    if(activity) actSheet(activity);
  }
}
sb.auth.onAuthStateChange((_e,session)=>{
  const u=session?session.user:null;
  if((u&&u.id)===(S.user&&S.user.id)) return;
  if(!$("#sheet").hidden) closeSheet();
  const toastBox=$("#toast"); toastBox.hidden=true; toastBox.innerHTML=""; clearTimeout(tt);
  Object.assign(S,{user:u,loaded:false,loadError:false,tasks:[],acts:[],session:null,settings:null,rec:{},pick:0});
  if(u){ S.view=load(userKey("view"),"home"); S.cal.day=load(userKey("calendarDay"),null); }
  if(u) setTimeout(boot,0); else render();
});
render();
})();
</script>
