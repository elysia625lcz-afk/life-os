<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life OS">
<title>Life OS</title>
<style>
/* One screen, one decision. Neutral surfaces; color only for category dots and warnings. */
:root{
  --bg:#F5F5F2; --card:#FFFFFF; --soft:#EEEDE8; --ink:#1F1F1C; --sub:#6B6A64; --faint:#9C9B94; --line:#E2E1DB;
  --primary:#1F1F1C; --on-primary:#FFFFFF; --warn-bg:#FAEEDA; --warn:#854F0B; --bad:#A32D2D; --ok:#3B6D11;
  --r:14px; --font:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413; --card:#1E1E1C; --soft:#2A2A27; --ink:#EDECE6; --sub:#A3A29B; --faint:#77766F; --line:#33332F;
  --primary:#EDECE6; --on-primary:#141413; --warn-bg:#3A2A12; --warn:#F0B55A; --bad:#F09595; --ok:#97C459; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:16px;
  padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.date{font-size:17px;font-weight:600}
.sub{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.faint{font-size:13px;color:var(--faint)}
.iconbtn{border:0;background:transparent;color:var(--sub);font-size:14px;padding:6px 8px;border-radius:8px}
.iconbtn:hover{background:var(--soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--card);border-color:var(--ink);color:var(--ink);font-weight:600}
.focus{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.label{font-size:13px;color:var(--sub)}
.title{font-size:22px;font-weight:600;line-height:1.35;margin:0;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.note{font-size:15px;overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;width:100%;overflow-wrap:anywhere}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:600}
.btn.small{width:auto;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);font-size:15px;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--faint)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.capture{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px}
.capture input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:6px 0;outline:none}
.capture button{border:0;border-radius:999px;background:var(--soft);padding:8px 14px;font-size:14px}
.empty{color:var(--sub);font-size:15px}
.ring{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;margin:16px auto 4px;position:relative}
.ring svg{position:absolute;inset:0}
.clock{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.center{text-align:center}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
textarea.f{resize:vertical;min-height:70px}
.fl{font-size:13px;color:var(--sub);margin:0 0 4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgb(0 0 0 / .4)}
.sheet .card{position:relative;background:var(--bg);width:min(560px,100%);max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px max(16px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:20px}}
.sheet h2{font-size:19px;margin:0}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);
  padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.search{display:flex;gap:8px}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--soft);border-radius:10px;padding:10px}
.err{color:var(--bad);font-size:14px;margin:0}
.daynav{display:flex;align-items:center;gap:6px}
.tlhead{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
.tl{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;position:relative}
.hours{position:relative}
.hours span{position:absolute;right:4px;font-size:11px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.lane{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:2px 6px;font-size:12px;line-height:1.3;overflow:hidden;border:0;text-align:left;color:#fff}
.blk.soft{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.blk b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:2;pointer-events:none}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.sum span{display:inline-flex;align-items:center;gap:6px}
.quadrants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quadrant{min-width:0;overflow-wrap:anywhere;padding:12px}
@media(max-width:460px){.quadrant .chip{padding:4px 8px}}
progress{display:block;width:100%;accent-color:#378ADD;margin-top:5px}
.project-child{padding:4px 0 10px;border-top:1px solid var(--line);min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.week-grid{display:grid;gap:10px}
.week-day{padding:12px}
.week-item{padding:4px 0;font-size:14px}
.week-item small{display:block}
.week-plan{gap:4px}
.home-top{flex-wrap:wrap}
.home-actions{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px}
.desktop-grid{display:grid;grid-template-columns:minmax(300px,0.85fr) minmax(0,1.15fr);gap:28px;width:100%;align-items:start}
.is-desktop{max-width:1480px;padding-inline:clamp(20px,3vw,48px)}
.desktop-home,.desktop-right{min-width:0}
.desktop-right{border-left:1px solid var(--line);padding-left:28px}
.desktop-right[data-view="all"] > .top > [data-act="home"]{visibility:hidden}
.desktop-right .week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
</style>

<script>
(function(){
"use strict";
const SUPABASE_URL="https://snrlbgksmydgtwwasdgk.supabase.co";
const SUPABASE_KEY="sb_publishable_gfZJQR2lreNoQd_gl2DHFQ_IgcNf9o4"; // publishable: safe in a browser, data is guarded by row-level security
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

const AREAS=[["Co-op","#378ADD"],["课程","#1D9E75"],["生活","#BA7517"],["兼职","#D85A30"],["学习","#7F77DD"],["运动","#D4537E"],["其他","#888780"]];
const areaColor=a=>(AREAS.find(x=>x[0]===a)||[0,"#B4B2A9"])[1];
const ENERGY=[["high","充沛"],["mid","一般"],["low","累了"]];
const STATUS=[["todo","待办"],["inbox","收件箱"],["someday","以后再说"],["done","已完成"]];
const MINS=[5,10,15,20,25,30,45,60,90];
const DEFAULT_ACTIVITIES=[
 {title:"整理电阻、导线或工具",minutes:10,steps:["拿出一小盒电阻或一把散放的导线，只选其中一种","电阻按阻值或色环分；导线按长度或颜色分","常用的 330Ω、4.7kΩ 放到顺手的位置","剩下的放回原处，拍张照片方便下次找"],done_when:"只整理一个小盒或一个抽屉就算完成",caution:"不通电、不测电路、不顺手调试项目",tags:["整理"],weight:1.4},
 {title:"准备明天的午饭",minutes:12,steps:["先看冰箱里有没有熟食、米饭、鸡蛋","有熟食就分装进饭盒；没有就准备一个简单组合","把明天要用的饭盒、餐具、水杯放在一起","要冷藏的马上放回冰箱"],done_when:"明天少一个准备步骤就算完成",caution:"生肉海鲜放冰箱里解冻；熟食别在室温放太久",tags:["生活"],weight:1},
 {title:"叠衣服或启动洗衣机",minutes:8,steps:["有干净衣服：先叠最好叠的 5 件","有待洗衣服：分深浅色，检查口袋","按标签选洗涤程序","把取衣服的时间记一下"],done_when:"叠 5 件，或者启动一桶就算完成",caution:"睡前别启动需要你熬夜等的程序",tags:["生活"],weight:1},
 {title:"清理书桌表面",minutes:7,steps:["拿一个垃圾袋，先丢掉明显的垃圾","把杯子、餐具、包装拿出书桌","散落的工具和课程纸张各归一处","擦出一块明天能直接开工的桌面"],done_when:"清出能放电脑和本子的一块地方就算完成",caution:"不开电脑整理文件，不研究桌上翻出来的元件",tags:["整理"],weight:1},
 {title:"听熟悉的音乐，伸展一下",minutes:10,steps:["放一首听过的、节奏平稳的歌，不刷推荐","慢慢活动肩膀、手腕和脖子","做几次胸背伸展和站姿小腿伸展","最后安静站一分钟"],done_when:"大概两首歌的时间就算完成",caution:"不追求拉到疼，不做高强度",tags:["运动"],weight:1}
];

const S={user:null,tasks:[],acts:[],rules:[],rulesError:false,settings:null,session:null,energy:load("energy","mid"),pick:0,view:"home",
  all:load("allFilter",{q:"",status:"todo",area:"",sort:"due"}),cal:{day:null},rec:{},loaded:false,busy:false,revision:0};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(k,d){try{return JSON.parse(localStorage.getItem("los."+k))??d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem("los."+k,JSON.stringify(v));}catch(e){}}
const userKey=k=>S.user.id+"."+k;
function setPick(index){S.pick=index;save(userKey("pick"),index);}
const desktopMedia=window.matchMedia?.("(min-width: 1024px)");
desktopMedia?.addEventListener("change",()=>render());

/* ---------- time ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d+n);return ymd(x);};
const WD=["日","一","二","三","四","五","六"];
const hm=t=>{if(!t)return null;const [h,m]=String(t).split(":").map(Number);return h*60+m;};
function sleepAt(settings=S.settings){ // bedtime in the current cycle, starting at day_start
  const st=settings||{}; const sl=hm(st.sleep_time)??1410, ds=hm(st.day_start)??480;
  const n=new Date(); const b=new Date(n.getFullYear(),n.getMonth(),n.getDate(),Math.floor(sl/60),sl%60);
  const beforeDayStart=n.getHours()*60+n.getMinutes()<ds;
  b.setDate(b.getDate()+(sl<ds?1:0)-(beforeDayStart?1:0));
  return b;
}
const minsLeftToSleep=()=>Math.round((sleepAt()-new Date())/60000);
const fmtMin=m=>m>=60?(Math.floor(m/60)+" 小时"+(m%60?" "+m%60+" 分":"")):m+" 分钟";
function dueText(t){
  if(!t.due_at) return "";
  const h=(new Date(t.due_at)-new Date())/36e5;
  const d=new Date(t.due_at);
  if(h<0) return "已过截止时间";
  if(ymd(d)===today()) return d.getHours()>=17?"今晚截止":"今天截止";
  if(ymd(d)===addDays(today(),1)) return "明天截止";
  const days=Math.ceil(h/24); return days<=7?days+" 天后截止":(d.getMonth()+1)+"月"+d.getDate()+"日截止";
}

/* ---------- recommendation (rules only, instant) ---------- */
const QUADRANTS=[
  [1,"重要且紧急","#D85A30"],[2,"重要不紧急","#378ADD"],
  [3,"紧急不重要","#BA7517"],[4,"其他","#1D9E75"]
];
const availableTask=t=>["todo","doing"].includes(t.status)&&!["routine","project"].includes(t.kind)&&visibleTask(t);
const important=t=>t.is_important??[1,2].includes(t.quadrant);
const urgent=t=>t.urgency_override??(!!t.due_at&&Date.parse(t.due_at)-Date.now()<=48*36e5);
const quadrant=t=>important(t)?(urgent(t)?1:2):(urgent(t)?3:4);
const dueOrder=t=>t.due_at?Date.parse(t.due_at):Infinity;
const priorityOrder=(a,b)=>quadrant(a)-quadrant(b);
const taskOrder=(a,b)=>priorityOrder(a,b)||(dueOrder(a)-dueOrder(b))||(a.est_min||25)-(b.est_min||25);
function quadrantGrid(tasks){
  return `<div class="quadrants">${QUADRANTS.map(([n,label,color])=>{
    const rows=tasks.filter(t=>quadrant(t)===n);
    return `<section class="focus quadrant" style="border-top:3px solid ${color}"><h2 class="fl">${label} · ${rows.length}</h2>
      ${rows.length?rows.map(t=>`<div class="list"><button class="row" data-act="edit" data-id="${t.id}"><span class="dot" style="background:${areaColor(t.area)}"></span><span class="t">${esc(t.title)}</span></button>${selectedButtons("quadrant-move",QUADRANTS.map(([i,l])=>[i,l]),n,t.id,"移动 "+t.title)}</div>`).join(""):'<p class="sub">这一格没有任务。</p>'}</section>`;
  }).join("")}</div>`;
}
function selectedButtons(act,options,active,id,label){
  return `<div class="chips" role="group" aria-label="${esc(label)}">${options.map(([v,l])=>`<button type="button" class="chip" data-act="${act}" data-id="${esc(id)}" data-v="${v}" aria-pressed="${v===active}">${l}</button>`).join("")}</div>`;
}

const TIME_OPTIONS=[[10,"10 分钟"],[20,"20 分钟"],[45,"45 分钟"],[0,"不限"]];
const recommendationFilter=()=>load(userKey("recommendation"),{minutes:0,area:""});
function rank(){
  const now=new Date(), td=today(), e=S.energy, out=[];
  const {minutes,area}=recommendationFilter();
  const late=now.getHours()>=23||minsLeftToSleep()<=0;
  const rules=matchingRules(now);
  const fits=(m,a)=>(!minutes||(m>0&&m<=minutes))&&(!area||area===a);
  const wishes=[];
  for(const t of S.tasks){
    if(!availableTask(t)||!fits(t.est_min,t.area)||(late&&quadrant(t)!==1)) continue;
    if(t.plan_date&&t.plan_date>td) continue;
    if(t.kind==="wish"&&!t.plan_date){
      if(!late&&(minutes===0||minutes===45)&&t.est_min>0) wishes.push({kind:"task",item:t,why:"心愿单",boost:ruleBoost(rules,t,false)});
      continue;
    }
    let s=0, why="";
    if(t.due_at){const h=(new Date(t.due_at)-now)/36e5;
      if(h<0){s+=95;why="已过截止时间";} else if(h<12){s+=90;why=dueText(t);} else if(h<36){s+=60;why=dueText(t);} else if(h<72){s+=35;why=dueText(t);} }
    if(t.plan_date===td){s+=40;why=why||"排在今天";}
    else if(t.plan_date&&t.plan_date<td){s+=30;why=why||"之前没做完";}
    if(t.status==="doing"||t.next_step){s+=15;why=why||"接着上次";}
    s+=[0,95,40,20,0][quadrant(t)];
    const pressing=urgent(t);
    if(e==="low"&&!pressing){ if((t.est_min||30)>30) s-=40; if(t.energy==="high") s-=30; if(t.energy==="low") s+=15; }
    if(e==="mid"&&(t.est_min||0)>90) s-=10;
    if(e==="high"&&t.energy==="high") s+=10;

    const boost=ruleBoost(rules,t,false);
    out.push({kind:"task",item:t,score:s+boost*30,boost,why:why||(boost?"符合你的规则":"")});
  }
  if(!late) for(const a of S.acts){
    const boost=ruleBoost(rules,a,true);
    if(!a.active||a.archived||!fits(a.minutes,a.area)||(e==="high"&&!boost)) continue;
    out.push({kind:"act",item:a,score:(e==="low"?55:12)*(a.weight||1)+boost*120,
      why:boost?"符合你的规则":e==="low"?"累了，做点不费脑的":"换换脑子"});
  }
  const tasks=out.filter(p=>p.kind==="task").sort((a,b)=>priorityOrder(a.item,b.item)||
    (quadrant(a.item)===1?dueOrder(a.item)-dueOrder(b.item):b.boost-a.boost)||(dueOrder(a.item)-dueOrder(b.item))||b.score-a.score||taskOrder(a.item,b.item));
  if(!tasks.some(p=>urgent(p.item))) tasks.push(...wishes.sort((a,b)=>b.boost-a.boost||taskOrder(a.item,b.item)));
  const cards=out.filter(p=>p.kind==="act").sort((a,b)=>b.score-a.score);
  const firstCard=tasks.findIndex(p=>quadrant(p.item)!==1&&(p.score??(e==="low"?0:35))<(cards[0]?.score??-Infinity));
  if(firstCard<0) return [...tasks,...cards];
  return [...tasks.slice(0,firstCard),...cards,...tasks.slice(firstCard)];
}
function todayOpen(){ return S.tasks.filter(t=>t.plan_date===today()&&availableTask(t)); }

/* ---------- data ---------- */
async function q(p,label){
  const user=S.user, r=await p;
  if(S.user!==user) throw new Error("Session changed");
  if(r.error){ toast((label||"没保存上")+"："+(r.error.message||"出错")); throw r.error; }
  return r.data;
}
async function loadAll(){
  const user=S.user, uid=user.id, revision=S.revision;
  let [tasks,acts,settings,sessions,caps]=await Promise.all([
    q(sb.from("tasks").select("*").neq("status","dropped").order("created_at"),"读取失败"),
    q(sb.from("activities").select("*").order("created_at"),"读取失败"),
    q(sb.from("settings").select("*").maybeSingle(),"读取失败"),
    q(sb.from("sessions").select("*").is("ended_at",null).order("started_at",{ascending:false}).limit(1),"读取失败"),
    q(sb.from("captures").select("*").is("processed_at",null).order("created_at"),"读取失败")]);
  if(S.user!==user) return;
  if(!settings){
    await q(sb.from("settings").upsert({user_id:uid},{onConflict:"user_id",ignoreDuplicates:true}));
    settings=await q(sb.from("settings").select("*").single(),"读取失败");
  }
  if(S.user!==user) return;
  if(!acts.length){
    await q(sb.rpc("seed_web_activities",{p_cards:DEFAULT_ACTIVITIES}),"活动卡没建好");
    acts=await q(sb.from("activities").select("*").order("created_at"),"读取失败");
  }
  for(const c of caps){ // Siri/watch captures become inbox tasks
    if(S.user!==user) return;
    const external_id="capture:"+c.id;
    const inserted=await q(sb.from("tasks").upsert({user_id:uid,external_id,title:c.text.slice(0,300),status:"inbox",source:c.source||"siri"},
      {onConflict:"user_id,external_id",ignoreDuplicates:true}).select());
    const t=inserted[0]||await q(sb.from("tasks").select("*").eq("external_id",external_id).single());
    if(S.user!==user) return;
    await q(sb.from("captures").update({processed_at:new Date().toISOString(),task_id:t.id}).eq("id",c.id));
    if(t.status!=="dropped"&&!tasks.some(row=>row.id===t.id)) tasks.push(t);
  }
  if(S.user!==user||S.revision!==revision) return;
  try{({tasks,settings}=await generateRoutines(tasks,settings));}catch(e){}
  if(!sessions.length&&settings.nudge_day!==today()&&tasks.some(nudgeEligible)){
    try{
      const r=await q(sb.rpc("web_nudge",{p_day:today(),p_action:"claim"}),"提醒没更新");
      settings=r.settings;
      if(r.task) tasks=tasks.map(t=>t.id===r.task.id?r.task:t);
    }catch(e){}
  }
  let rules=S.rules, rulesError=false;
  try{rules=await q(sb.from("web_rules").select("*"),"没读到规则");}
  catch(e){rulesError=true;}
  if(S.user!==user||S.revision!==revision) return;
  Object.assign(S,{tasks,acts,rules,rulesError,settings,session:sessions[0]||null});
  S.loaded=true;
}

async function createTask(data,draftType){
  const key=userKey("pendingTask."+draftType), previous=load(key,null);
  // done_at is assigned at submit time, so it is not part of the draft identity.
  const signature=JSON.stringify({...data,done_at:undefined});
  const id=previous?.signature===signature?previous.id:crypto.randomUUID();
  save(key,{id,signature});
  const inserted=await q(sb.from("tasks").upsert({...data,id,user_id:S.user.id},{onConflict:"id",ignoreDuplicates:true}).select());

async function inboxAction(a,v){
  const key=userKey("inboxSelected"), focusKey=userKey("inboxFocus"), filterKey=userKey("inboxFilter");
  const rows=[...document.querySelectorAll('[data-act="inbox-focus"]')];
  const selected=load(key,[]);

  if(a==="inbox-select"){save(key,selected.includes(v)?selected.filter(id=>id!==v):[...selected,v]);render();return;}
  if(a==="inbox-area"||a==="inbox-sort"){
    const filter=load(filterKey,{q:"",area:"",oldest:true});
    if(a==="inbox-area") filter.area=v; else filter.oldest=!filter.oldest;
    save(filterKey,filter);render();return;
  }
  const focus=rows.find(b=>b.getAttribute("aria-pressed")==="true")?.dataset.v;
  const visible=rows.map(b=>b.dataset.v), batch=selected.filter(id=>visible.includes(id));
  const ids=batch.length?batch:focus?[focus]:[];
  if(!ids.length||!beginWrite()) return;
  const changes=v==="important"?{is_important:true}:v==="delete"?{status:"dropped"}:
    v==="someday"?{status:"someday",plan_date:null,plan_start:null}:
    {status:"todo",plan_date:addDays(today(),v==="tomorrow"?1:0),plan_start:null};
  try{
    const updated=await q(sb.from("tasks").update(changes).in("id",ids).eq("status","inbox").select());
    updated.forEach(t=>patchLocal(t.id,t));
    save(key,selected.filter(id=>!ids.includes(id)));
    const index=visible.indexOf(focus);
    save(focusKey,visible.slice(index+1).find(id=>!ids.includes(id))||visible.find(id=>!ids.includes(id))||null);
    render();
    if(v==="delete"&&updated.length){
      toast(`已删除 ${updated.length} 条`,{label:"撤销",fn:async()=>{
        if(!beginWrite()) return;
        try{
          const restored=await q(sb.from("tasks").update({status:"inbox"}).in("id",updated.map(t=>t.id)).eq("status","dropped").select());
          restored.forEach(upsertLocal);render();
        }catch(e){}finally{S.busy=false;}
      }});
    }else toast(updated.length?`已处理 ${updated.length} 条`:"这些条目已被整理。");

const WEEKDAYS=[[1,"周一"],[2,"周二"],[3,"周三"],[4,"周四"],[5,"周五"],[6,"周六"],[7,"周日"]];
const eventOn=(ev,day)=>!ev.archived&&(ev.on_date===day||(!ev.on_date&&ev.repeat_days?.includes(isoDow(day))&&
  (!ev.valid_from||ev.valid_from<=day)&&(!ev.valid_until||day<=ev.valid_until)));
const clockLabel=m=>m===1440?"24:00":pad(Math.floor(m/60))+":"+pad(m%60);
function freeSlots(day,events,tasks,settings,scheduleFrom=null){
  if(day<today()) return [];
  const start=hm(settings.day_start)??480, sleep=hm(settings.sleep_time)??1410;
  const windows=sleep<start?[[0,sleep],[start,1440]]:[[start,sleep]];
  const now=new Date(), nowMin=wallMinutes(now)+(now.getSeconds()||now.getMilliseconds()?1:0);
  const bedtime=sleepAt(settings), bedtimeDay=ymd(bedtime);
  const first=day===today()?Math.max(nowMin,scheduleFrom??0):0;
  const last=day===today()?(bedtimeDay<day?0:bedtimeDay===day?wallMinutes(bedtime):1440):1440;
  const busy=events.filter(e=>eventOn(e,day)).map(e=>[hm(e.start_time),hm(e.end_time)]);
  for(const t of tasks){
    if(t.plan_date===day&&t.plan_start&&!["done","dropped","someday","inbox"].includes(t.status)&&!["project","routine"].includes(t.kind)){
      const s=hm(t.plan_start);busy.push([s,s+(t.est_min||25)]);
    }
  }
  busy.sort((a,b)=>a[0]-b[0]);
  const slots=[];
  for(const [start,end] of windows){
    let cursor=Math.max(start,first);const limit=Math.min(end,last);
    for(const [a,b] of busy){
      if(b<=cursor) continue;
      if(a>=limit) break;
      if(a>cursor) slots.push([cursor,a]);
      cursor=Math.max(cursor,b);
    }
    if(cursor<limit) slots.push([cursor,limit]);
  }
  return slots;
}
function reserveSlot(slots,minutes,limit=1440){
  const slot=slots.find(([start,end])=>start+minutes<=Math.min(end,limit));
  if(!slot) return null;
  const start=slot[0];slot[0]+=minutes;
  return clockLabel(start);
}
const routineDays=t=>t.routine_days||WEEKDAYS.map(([day])=>day);
const activeRoutine=t=>t.kind==="routine"&&t.status!=="dropped"&&!t.routine_paused;
const routineOrder=(a,b)=>(a.routine_priority??2)-(b.routine_priority??2)||taskOrder(a,b)||a.title.localeCompare(b.title,"zh");
async function generateRoutines(tasks,settings){
  const day=today();
  const templates=tasks.filter(t=>activeRoutine(t)&&routineDays(t).includes(isoDow(day))).sort(routineOrder);
  if(!templates.length||settings.routine_generated_day>=day) return {tasks,settings};
  const events=await q(sb.from("events").select("*"),"没读到固定日程");
  const slots=freeSlots(day,events,tasks,settings), plan=[];
  for(const t of templates){
    const start=reserveSlot(slots,t.est_min||25);
    if(start!==null) plan.push({template_id:t.id,start});
  }
  const result=await q(sb.rpc("web_generate_routines",{p_day:day,p_plan:plan,p_now:localTimestamp()}),"例行没生成");
  const generated=new Set(result.tasks.map(t=>t.id));
  return {tasks:[...tasks.filter(t=>!generated.has(t.id)),...result.tasks.filter(t=>t.status!=="dropped")],settings:result.settings};
}

const WISH_FILTER={q:"",area:"",time:"all",hide:true,sort:"short"};
const weekStart=day=>addDays(day,1-isoDow(day));
const weekDays=day=>Array.from({length:7},(_,i)=>addDays(weekStart(day),i));
const taskMinutes=t=>t.est_min||25;
function placeTasks(tasks,days,events,busy=S.tasks,settings=S.settings,scheduleFrom=null){
  const now=new Date();
  const free=new Map(days.map(day=>[day,freeSlots(day,events,busy,settings,scheduleFrom)]));
  const plan=[];
  for(const t of tasks){
    for(const day of days){
      const due=t.due_at&&Date.parse(t.due_at)>=now?new Date(t.due_at):null;
      const limit=due&&ymd(due)===day&&day>=today()?wallMinutes(due):1440;
      if(due&&day>ymd(due)) break;
      const start=reserveSlot(free.get(day),taskMinutes(t),limit);
      if(start!==null){
        plan.push({...planBaseline(t),day,start});
        break;
      }
    }
  }
  return plan;
}

async function loadRecord(day,keepRows=false){

const wallMinutes=t=>t.getHours()*60+t.getMinutes();
function recordSpan(start,end,d0,d1){
  const from=Math.max(Date.parse(start),+d0), to=Math.min(+end,+d1);
  if(!(to>from)) return null;
  const s=wallMinutes(new Date(from)), e=to===+d1?1440:wallMinutes(new Date(to));
  return {s,e:Math.max(s,e),minutes:(to-from)/60000};
}
function calendarRecords(day,record){
  const d0=dayStart(day), d1=dayStart(addDays(day,1)), now=new Date();
  const rec=[], perApp=new Map(); let fun=0, work=0;
    for(const u of (record.usage||[])){ const cap=Date.parse(u.started_at)+3*36e5, en=Math.min(u.ended_at?Date.parse(u.ended_at):+now,cap);
      const span=recordSpan(u.started_at,en,d0,d1); if(!span) continue;
      rec.push({...span,title:u.app,color:appColor(u.app),open:!u.ended_at&&day===today()&&now<cap});
      perApp.set(u.app,(perApp.get(u.app)||0)+span.minutes); fun+=span.minutes; }
    for(const x of (record.sessions||[])){ const en=x.ended_at?Date.parse(x.ended_at):+now;
      const span=recordSpan(x.started_at,en,d0,d1); if(!span) continue;
      const tk=S.tasks.find(t=>t.id===x.task_id), ac=S.acts.find(a=>a.id===x.activity_id);

}

function extensionConflicts(session,end,events){
  const extensionStart=new Date(Math.max(Date.now(),Date.parse(session.started_at)+session.planned_min*60000));
  const firstDay=ymd(extensionStart), lastDay=ymd(end);
  const names=[];
  for(let day=firstDay;day<=lastDay;day=addDays(day,1)){
    const from=day===firstDay?wallMinutes(extensionStart):0;
    const to=day===lastDay?Math.ceil(wallMinutes(end)+(end.getSeconds()+end.getMilliseconds()/1000)/60):1440;
    if(to<=from) continue;
    const tasks=S.tasks.filter(t=>availableTask(t)&&t.id!==session.task_id&&t.plan_date===day);
    for(const task of tasks){
      const start=hm(task.plan_start);
      if(start!=null&&start<to&&start+taskMinutes(task)>from) names.push(task.title);
    }
    for(const event of events){
      if(eventOn(event,day)&&hm(event.start_time)<to&&hm(event.end_time)>from) names.push(event.title);
    }
    const remaining=tasks.filter(t=>!t.plan_start).sort(taskOrder);
    if(!remaining.length) continue;
    const free=freeSlots(day,events,S.tasks,S.settings);
    const before=free.map(([start,stop])=>[Math.max(start,from),stop]).filter(([start,stop])=>stop>start);
    const after=free.map(([start,stop])=>[Math.max(start,to),stop]).filter(([start,stop])=>stop>start);
    for(const task of remaining){
      const fitsBefore=reserveSlot(before,taskMinutes(task))!==null;
      const fitsAfter=reserveSlot(after,taskMinutes(task))!==null;
      if(fitsBefore&&!fitsAfter) names.push(task.title);
    }
  }
  return [...new Set(names)];
}

function bindCatalogForm(form,key,draft,fields,paint,submit){
  const inputs=[...form.querySelectorAll("input,select,textarea,button")];
  const keep=()=>{
    for(const [name,id] of Object.entries(fields)) draft[name]=$("#"+id).value;
    save(key,draft);paint?.();
  };
  form.oninput=form.onchange=keep;
  form.onsubmit=async ev=>{
    ev.preventDefault();if(S.busy) return;
    keep();
    const data=submit.data(draft);
    if(typeof data==="string"){submit.error.textContent=data;return;}
    if(!beginWrite()) return;
    inputs.forEach(input=>input.disabled=true);
    try{
      await submit.write(data);
      save(key,null);closeSheet();render();toast(submit.message);
    }catch(e){submit.error.textContent="没保存上，请重试。";}
    finally{inputs.forEach(input=>input.disabled=false);S.busy=false;}
  };
  return keep;
}

async function startSession(data,nudged=false){
  if(S.session||!beginWrite()) return;
  try{
    const result=await q(sb.rpc("start_web_session",{p_task:data.task_id??null,p_activity:data.activity_id??null,p_min:data.planned_min}),"没开始成");
    S.session=result.session;
    if(result.task){
      if(S.tasks.some(t=>t.id===result.task.id)) patchLocal(result.task.id,result.task);
      else if(result.task.status!=="dropped") S.tasks.push(result.task);
    }
    if(nudged&&result.session.task_id===data.task_id){
      try{await resolveNudge("start",data.task_id);}catch(e){}
    }
    closeSheet(); render();
  }catch(e){} finally{ S.busy=false; }
}

document.addEventListener("click",async ev=>{

  if(S.busy) return;
  if(a==="close-sheet") return closeSheet();

    const filter=recommendationFilter();

    save(userKey("recommendation"),filter);setPick(0);return render();
  }
  if(a==="nudge"){
    const task=S.tasks.find(t=>t.id===S.settings.nudge_task_id);

  if(a.startsWith("routine-")) return routineAction(a,el.dataset.v);
  if(a.startsWith("project-")) return projectAction(a,el);
  if(a==="all"||a==="home"||a==="inbox"||a==="projects"||a==="routines"||a==="wishes") return changeView(a);

    const f=calendarFilter();
    if(a==="cal-area") f.area=el.dataset.v;else f.hideDone=!f.hideDone;

  }

    save(userKey("calendarMode"),a==="cal-select-day"?"day":el.dataset.v);S.rec={};return render();
  }
  if(a==="event-new") return eventSheet(null);
  if(a==="event-edit"){
    const event=S.rec.events?.find(e=>e.id===id);
    if(event) return eventSheet(event);
  }
  if(a==="event-delete") return archiveEvent(el.dataset.v);
  if(a==="retry-record") return loadRecord(calendarDay());
  if(a==="cal-day"){ const v=+el.dataset.v; S.cal.day=v===0?null:addDays(calendarDay(),v); save(userKey("calendarDay"),S.cal.day); render(); return; }
  if(a==="settings") return settingsSheet();
  if(a==="show-rules"||a==="show-activities"){
    save(userKey("settingsBackView"),S.view);closeSheet();return changeView(a==="show-rules"?"rules":"activities");
  }
  if(a==="return-settings"){changeView(load(userKey("settingsBackView"),"home"));return settingsSheet();}
  if(a.startsWith("activity-")) return activityAction(a,el.dataset.v);
  if(a.startsWith("rule-")) return ruleAction(a,el.dataset.v);
  if(a==="quadrants"){const key=userKey("byQuadrant");save(key,!load(key,false));return render();}

  if(a==="adj"){
    if(!S.session||!beginWrite()) return;
    const s=S.session, m=Math.max(1,Math.min(600,s.planned_min+(+el.dataset.v)));
    try{ S.session=await q(sb.from("sessions").update({planned_min:m}).eq("id",s.id).is("ended_at",null).select().single()); startTick(); }
    catch(e){}finally{ S.busy=false; }
    return;
  }
  if(a==="stop") return stopSheet();
  if(a==="fstatus"||a==="farea"||a==="fsort"){ S.all[{fstatus:"status",farea:"area",fsort:"sort"}[a]]=el.dataset.v; save("allFilter",S.all); return render(); }
  if(a==="del"){ const t=S.tasks.find(x=>x.id===id); const prev=t.status;
    if(!beginWrite()) return;
    try{ await updTask(id,{status:"dropped"}); save(userKey("taskDraft."+id),null); S.projectTime=null; closeSheet(); render();
      toast("删掉了「"+t.title+"」",{label:"撤销",fn:async()=>{
        if(!beginWrite()) return;
        try{
          const restored=await updTask(id,{status:prev});
          if(!S.tasks.some(row=>row.id===id)) S.tasks.push(restored);
          S.projectTime=null;render();
        }catch(e){}finally{ S.busy=false; }
      }});
    }catch(e){}finally{ S.busy=false; } return; }
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id==="rule-notes-form"){ev.preventDefault();return saveRuleNotes(ev.target);}
  if(ev.target.id==="cap"){ ev.preventDefault(); const inp=$("#capin"), v=inp.value.trim(); if(!v||!beginWrite()) return;
    const btn=ev.target.querySelector('[type="submit"]'); inp.disabled=true; btn.disabled=true;
    try{ await createTask({title:v.slice(0,300),status:"inbox",source:"web"},"capture"); save("capDraft",""); toast("记下了，在收件箱里"); render(); }
    catch(e){ inp.disabled=false; btn.disabled=false; }finally{ S.busy=false; } }
  if(ev.target.id==="login"){
    ev.preventDefault(); const btn=ev.target.querySelector('[type="submit"]'); if(btn.disabled) return;
    btn.disabled=true;
    try{
      const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
      if(r.error) throw r.error;
    }catch(error){ const err=$("#lerr"); if(err) err.textContent="登录没成功："+(error.message.includes("Invalid")?"邮箱或密码不对":error.message); }
    finally{ btn.disabled=false; }
  }
});
function updateSearch(field,name,defaults){
  const key=userKey(name);
  save(key,{...load(key,defaults),q:field.value});
  const pos=field.selectionStart,id=field.id;
  render();
  const replacement=$("#"+id);replacement.focus();replacement.setSelectionRange(pos,pos);
}
document.addEventListener("input",ev=>{
  if(ev.target.id==="capin") save("capDraft",ev.target.value);
  if(ev.target.id==="rule-notes") save(settingNotesKey(),ev.target.value);
  if(ev.target.id==="activityq") return updateSearch(ev.target,"activityFilter",ACTIVITY_FILTER);
  if(ev.target.id==="ruleq") return updateSearch(ev.target,"ruleFilter",RULE_FILTER);
  if(ev.target.id==="wishq") return updateSearch(ev.target,"wishFilter",WISH_FILTER);
  if(ev.target.id==="routineq") return updateSearch(ev.target,"routineFilter",{state:"all",sort:"priority"});
  if(ev.target.id==="projectq") return updateSearch(ev.target,projectFilterName(load(userKey("projectId"),null)),PROJECT_FILTER);
  if(ev.target.id==="inboxq") return updateSearch(ev.target,"inboxFilter",{area:"",oldest:true});
  if(ev.target.id==="allq"){ S.all.q=ev.target.value; save("allFilter",S.all); const pos=ev.target.selectionStart; render(); const n=$("#allq"); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="recommendation-place"){save(userKey("recommendationPlace"),ev.target.value);setPick(0);render();}
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!S.busy&&!$("#sheet").hidden) closeSheet(); });
addEventListener("scroll",()=>{ if(S.loaded&&!S.session&&!S.restoring) save(userKey("scroll."+S.view),scrollY); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
setInterval(()=>{ if(document.visibilityState==="visible"&&!S.session&&$("#sheet").hidden) refresh(); },60000);

/* ---------- boot ---------- */
// Never await Supabase calls inside onAuthStateChange: supabase-js holds a lock there and the calls deadlock.
async function boot(){
  if(!S.user||S.loading===S.user) return;
  const user=S.user;
  S.loadError=false; render();
  try{ await readAll(); }catch(e){ if(S.user===user) S.loadError=true; }
  if(S.user!==user) return;
  render();
  if(!S.loaded) return;
  S.restoring=true;
  scrollTo(0,load(userKey("scroll."+S.view),0));
  requestAnimationFrame(()=>{ S.restoring=false; });
  const card=new URLSearchParams(location.search).get("card"); // opened from a Shortcut nudge
  if(card){ const a=S.acts.find(x=>x.id===card); if(a) actSheet(a); else { const t=S.tasks.find(x=>x.id===card); if(t) editSheet(t); } history.replaceState(null,"",location.pathname); return; }
  const panel=load(userKey("panel"),null);
  if(panel?.type==="stop"&&S.session?.id===panel.id) stopSheet();
  if(panel?.type==="task"&&!S.session){
    const task=panel.id?S.tasks.find(t=>t.id===panel.id):null;
    if(task||!panel.id) editSheet(task,panel.context);
  }
  if(panel?.type==="activity-edit"&&!S.session){
    const card=panel.id?S.acts.find(a=>a.id===panel.id&&!a.archived):null;
    if(card||!panel.id) activityEditor(card);
  }
  if(panel?.type==="rule"&&!S.session){
    const rule=panel.id?S.rules.find(r=>r.id===panel.id&&!r.archived):null;
    if(rule||!panel.id) ruleSheet(rule);
  }
  if(panel?.type==="planner"&&!S.session) plannerSheet(false,panel.scope);
  if(panel?.type==="event"&&!S.session) eventSheet(panel.event||null);
  if(panel?.type==="routine"&&!S.session){
    const t=panel.id?S.tasks.find(t=>t.id===panel.id):null;
    if(t||!panel.id) routineSheet(t);
  }
  if(panel?.type==="settings"&&!S.session) settingsSheet();
  if(panel?.type==="replan"&&panel.day===today()&&!S.session) replanSheet();
  if(panel?.type==="activity"&&!S.session){
    const activity=S.acts.find(a=>a.id===panel.id);
    if(activity) actSheet(activity);
  }
}
sb.auth.onAuthStateChange((_e,session)=>{
  const u=session?session.user:null;
  if((u&&u.id)===(S.user&&S.user.id)) return;
  if(!$("#sheet").hidden) closeSheet();
  const toastBox=$("#toast"); toastBox.hidden=true; toastBox.innerHTML=""; clearTimeout(tt);
  Object.assign(S,{user:u,loaded:false,loadError:false,tasks:[],acts:[],rules:[],rulesError:false,session:null,settings:null,rec:{},projectTime:null,activityLikes:null,pick:0});
  if(u){ S.pick=load(userKey("pick"),0); S.view=load(userKey("view"),"home"); S.cal.day=load(userKey("calendarDay"),null); }
  if(u) setTimeout(boot,0); else render();
});
render();
})();
