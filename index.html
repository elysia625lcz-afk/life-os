<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life OS">
<title>Life OS</title>
<style>
/* One screen, one decision. */
:root{
  --bg:#f7efe5;--card:#fffaf2;--soft:#f0e5d8;--ink:#322a36;--sub:#645664;--faint:#706272;--line:#dccabb;
  --primary:#51394a;--on-primary:#fff8ec;--warn-bg:#FAEEDA;--warn:#854F0B;--bad:#A32D2D;--ok:#3B6D11;
  --gold:#a07240;--plum:#503348;--cream:#fff6e9;--paper-shadow:0 14px 34px #4a2e3720;
  --font:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --serif:ui-serif,"Songti SC","STSong",Georgia,serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#221f37;--card:#302a44;--soft:#3b334d;--ink:#f9efe9;--sub:#d3c1d0;--faint:#c5b3c9;--line:#594b65;
  --primary:#f3d9e2;--on-primary:#34243b;--warn-bg:#3A2A12;--warn:#F0B55A;--bad:#F09595;--ok:#97C459;
  --gold:#e2b582;--plum:#f2d9e4;--cream:#352840;--paper-shadow:0 14px 34px #130e2750;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:12px;position:relative;
  padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.date{font-size:17px;font-weight:600}
.sub{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.faint{font-size:13px;color:var(--faint)}
.iconbtn{border:0;background:transparent;color:var(--sub);font-size:14px;padding:6px 8px;border-radius:8px}
.iconbtn:hover{background:var(--soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--card);border-color:var(--ink);color:var(--ink);font-weight:600}
.focus{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.label{font-size:13px;color:var(--sub)}
.title{font-size:22px;font-weight:600;line-height:1.35;margin:0;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.note{font-size:15px;overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;width:100%;overflow-wrap:anywhere}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:600}
.btn.small{width:auto;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);font-size:15px;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--faint)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.capture{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px}
.capture input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:6px 0;outline:none}
.capture button{border:0;border-radius:999px;background:var(--soft);padding:8px 14px;font-size:14px}
.empty{color:var(--sub);font-size:15px}
.ring{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;margin:16px auto 4px;position:relative}
.ring svg{position:absolute;inset:0}
.clock{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.center{text-align:center}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
textarea.f{resize:vertical;min-height:70px}
.fl{font-size:13px;color:var(--sub);margin:0 0 4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgb(0 0 0 / .4)}
.sheet .card{position:relative;background:var(--bg);width:min(560px,100%);max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px max(16px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:20px}}
.sheet h2{font-size:19px;margin:0}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);
  padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.search{display:flex;gap:8px}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--soft);border-radius:10px;padding:10px}
.err{color:var(--bad);font-size:14px;margin:0}
.daynav{display:flex;align-items:center;gap:6px}
.tlhead{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
.tl{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;position:relative}
.hours{position:relative}
.hours span{position:absolute;right:4px;font-size:11px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.lane{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:2px 6px;font-size:12px;line-height:1.3;overflow:hidden;border:0;text-align:left;color:#fff}
.blk.soft{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.blk b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:2;pointer-events:none}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.sum span{display:inline-flex;align-items:center;gap:6px}
.quadrants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quadrant{min-width:0;overflow-wrap:anywhere;padding:12px}
@media(max-width:460px){.quadrant .chip{padding:4px 8px}}
progress{display:block;width:100%;accent-color:#378ADD;margin-top:5px}
.project-child{padding:4px 0 10px;border-top:1px solid var(--line);min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.week-grid{display:grid;gap:10px}
.week-day{padding:12px}
.week-item{padding:4px 0;font-size:14px}
.week-item small{display:block}
.week-plan{gap:4px}
.home-actions{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px}
.desktop-grid{display:grid;grid-template-columns:minmax(300px,0.85fr) minmax(0,1.15fr);gap:clamp(24px,4vw,60px);width:100%;align-items:start}
.is-desktop{max-width:1480px;padding-inline:clamp(20px,3vw,48px)}
.desktop-home,.desktop-right{min-width:0;position:relative}
.desktop-right[data-view="all"] > .top > [data-act="home"]{visibility:hidden}
.desktop-right .week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.paper-grain{position:fixed;inset:0;width:100%;height:100%;opacity:.055;pointer-events:none;z-index:35}
.home-top{flex-wrap:nowrap;align-items:flex-start;gap:4px 10px}
.home-top .date{font-family:var(--serif);font-size:22px;font-weight:800}
.home-date{display:grid;gap:2px}
.home-date .sub{font-size:12px}
.home-actions .iconbtn{border-bottom:1px solid var(--line);border-radius:0;padding-inline:6px}
.page-whisper{position:relative;margin:0;padding:6px 40px 7px 10px;border-left:2px solid var(--gold);color:var(--sub);
  font:600 15px/1.5 var(--serif);letter-spacing:.04em;min-height:34px}
.whisper-mark{position:absolute;inset:0 1px auto auto;width:30px;height:30px;color:var(--gold);opacity:.6;pointer-events:none}
[data-note-page="cal"] .whisper-mark,[data-note-page="rules"] .whisper-mark{right:12%;transform:rotate(-12deg)}
[data-note-page="all"] .whisper-mark,[data-note-page="wishes"] .whisper-mark{right:5%;transform:rotate(14deg)}
[data-note-page="projects"] .whisper-mark,[data-note-page="routines"] .whisper-mark{right:20%;transform:rotate(-8deg)}
[data-note-page="cal"],[data-note-page="rules"],[data-note-page="all"],[data-note-page="wishes"],
[data-note-page="projects"],[data-note-page="routines"]{padding-right:calc(20% + 32px)}
[data-note-page="inbox"] .whisper-mark{right:3%;top:5px}
[data-note-page="activities"] .whisper-mark{right:7%;top:-2px}
[data-note-page="timer"] .whisper-mark{right:2%;top:-2px}
.focus-hero,.timer-paper{
  --wash-a:#f8e1c3;--wash-b:#e7cee5;--wash-c:#facfc1;--wash-ink:#37283b;--wash-mark:#895175;
  color:var(--wash-ink);background:linear-gradient(133deg,var(--wash-a),var(--wash-b) 65%,var(--wash-c));
  position:relative;isolation:isolate;overflow:hidden;border:1px solid #7b52643d;box-shadow:var(--paper-shadow)
}
[data-paper="0"]{--wash-a:#e0eef6;--wash-b:#c3d9ef;--wash-c:#e8ddf6;--wash-mark:#3b6894}
[data-paper="1"]{--wash-a:#edf2d5;--wash-b:#c6e2d0;--wash-c:#cfe9e4;--wash-mark:#396e58}
[data-paper="2"]{--wash-a:#f9edcb;--wash-b:#f2d7a8;--wash-c:#f7dac8;--wash-mark:#8d5d29}
[data-paper="3"]{--wash-a:#fae9d8;--wash-b:#efcbba;--wash-c:#f5d5d4;--wash-mark:#974c3a}
[data-paper="4"]{--wash-a:#f1e9f8;--wash-b:#dbcef2;--wash-c:#f4d6e6;--wash-mark:#785093}
[data-paper="5"]{--wash-a:#fae9ed;--wash-b:#eecada;--wash-c:#f5d9c6;--wash-mark:#964c6b}
[data-paper="6"]{--wash-a:#f1eadb;--wash-b:#d9dfd7;--wash-c:#e4dceb;--wash-mark:#646d68}
@media(prefers-color-scheme:dark){
  .focus-hero,.timer-paper{--wash-a:#3b2c43;--wash-b:#4b345b;--wash-c:#5c3c50;--wash-ink:#fff3f3;--wash-mark:#f4c6e2}
  [data-paper="0"]{--wash-a:#26354e;--wash-b:#354870;--wash-c:#43365a;--wash-mark:#beddf7}
  [data-paper="1"]{--wash-a:#263c3d;--wash-b:#325347;--wash-c:#364656;--wash-mark:#bae9cd}
  [data-paper="2"]{--wash-a:#453536;--wash-b:#5b4533;--wash-c:#4d3b58;--wash-mark:#f7d8a6}
  [data-paper="3"]{--wash-a:#4b323d;--wash-b:#623e43;--wash-c:#554057;--wash-mark:#ffd1ba}
  [data-paper="4"]{--wash-a:#3a3057;--wash-b:#4e3b66;--wash-c:#533f60;--wash-mark:#e4cefa}
  [data-paper="5"]{--wash-a:#44314e;--wash-b:#663b56;--wash-c:#56384a;--wash-mark:#f8cce0}
  [data-paper="6"]{--wash-a:#353444;--wash-b:#464852;--wash-c:#494056;--wash-mark:#deddd5}
}
.focus-hero::before,.timer-paper::before{content:"";position:absolute;inset:-10%;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse at 30% 65%,var(--wash-c),transparent 60%);opacity:.64;animation:paper-light 24s ease-in-out infinite alternate}
@keyframes paper-light{from{transform:translate(-7%,-8%)}to{transform:translate(12%,5%)}}
.paper-mark{position:absolute;z-index:-1;pointer-events:none;right:-10%;bottom:-21%;width:min(91%,420px);height:auto;opacity:.25;color:var(--wash-mark)}
.timer-paper .paper-mark{width:min(94%,560px);right:-16%;bottom:-28%}
.focus-hero{border-radius:28px;min-height:clamp(350px,57svh,510px);padding:clamp(18px,4.4vw,32px);gap:12px}
.hero-label{font-size:12px;font-weight:700;letter-spacing:.1em;align-self:flex-start;padding:4px 10px;border:1px solid currentColor;border-radius:99px}
.focus-hero .hero-title{align-self:flex-start;color:inherit;font:800 clamp(28px,5vw,34px)/1.23 var(--serif);
  text-align:left;padding:0;border:0;background:none;max-width:100%;margin:0}
.focus-hero .hero-copy{display:grid;gap:6px}
.hero-copy p{margin:0;overflow-wrap:anywhere}
.hero-copy .title{line-height:1.23}
.hero-reason{font-size:14px;font-weight:650}
.hero-resume{font-size:13px}
.hero-actions{margin-top:auto;display:grid;justify-items:center;gap:6px;padding-top:8px}
.hero-start{display:grid;align-content:center;justify-items:center;gap:2px;width:98px;height:98px;padding:5px;border-radius:50%;
  border:1px solid var(--cream);background:var(--plum);color:var(--cream);box-shadow:0 0 0 5px #ffffff39,0 8px 18px #33213738}
.hero-start strong{font-size:19px;font-weight:750}
.hero-start small{font-size:12px}
.hero-next{border:0;background:none;color:inherit;padding:8px 12px;font-size:13px;text-underline-offset:4px;text-decoration:underline}
.hero-swapped{animation:card-slide .32s ease-out both}
@keyframes card-slide{from{transform:translateX(14px);opacity:.25}to{transform:translateX(0);opacity:1}}
.hero-empty{justify-content:center}
.hero-empty .paper-mark{opacity:.18}
.capture{box-shadow:0 3px 9px #442e3510}
.capture:focus-within{outline:2px solid #378ADD;outline-offset:2px}
.today-progress{display:flex;flex-wrap:wrap;gap:4px 13px;margin:0;padding:5px 0 5px 2px;color:var(--sub);font-size:13px}
.today-progress b{color:var(--ink);font-weight:750}
.recommend-controls{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.page-edge{position:absolute;right:3%;bottom:6px;width:48px;height:48px;opacity:.21;color:var(--gold);pointer-events:none}
.page-edge svg{display:block;width:100%;height:100%}
[data-edge="cal"],[data-edge="rules"]{right:17%;transform:rotate(-12deg)}
[data-edge="home"],[data-edge="projects"]{right:8%;transform:rotate(12deg)}
.blk:not(.soft){color:var(--ink);background:var(--card);background:color-mix(in srgb,var(--card) 76%,var(--block-color));box-shadow:inset 3px 0 var(--block-color)}
.desktop-right{padding:16px clamp(16px,2.5vw,28px);background:var(--card);border:1px solid var(--line);
  border-radius:22px;box-shadow:0 4px 18px #46334212}
@media(min-width:1024px){
  .is-desktop{padding-top:clamp(24px,4vh,46px)}
  .focus-hero{min-height:clamp(405px,57svh,510px)}
}
.timer-paper{flex:1;display:flex;flex-direction:column;gap:13px;padding:clamp(18px,4vw,34px);border-radius:28px}
.timer-paper .steps{overflow-wrap:anywhere}
.timer-paper .title{font:800 clamp(25px,5vw,34px)/1.3 var(--serif)}
.timer-paper :is(.label,.sub,.faint,.page-whisper){color:inherit}
.timer-paper .chip{color:inherit;border-color:currentColor;min-width:64px}
.timer-paper .ring{width:min(100%,clamp(200px,36vh,294px));height:auto;aspect-ratio:1;margin:14px auto}
.timer-paper .clock{font-size:clamp(45px,12vw,64px);font-weight:750;line-height:1.1;letter-spacing:-.04em}
.timer-paper .ring-track{opacity:.25}
.timer-paper .ring-fill{transition:stroke-dashoffset .35s linear}
.timer-paper .btn.primary{margin-top:auto;background:var(--plum);color:var(--cream)}
@media(min-width:700px){.wrap:has(.timer-paper){max-width:760px;padding-block:32px}}
.interlude{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:auto;
  padding:18px;background:#271e3ba8;overscroll-behavior:contain}
.interlude[data-mode="opening"]{background:linear-gradient(144deg,#fbecd3,#eacadd 62%,#dacff1)}
.interlude-card{position:relative;isolation:isolate;display:grid;justify-items:center;align-content:center;gap:12px;border-radius:28px;
  width:min(100%,465px);min-height:min(350px,75dvh);padding:28px 20px;overflow:hidden;text-align:center;background:var(--card);
  color:var(--ink);box-shadow:var(--paper-shadow);border:1px solid var(--line)}
[data-mode="opening"] .interlude-card{background:none;border-color:transparent;box-shadow:none;color:#422d44}
.interlude-card h2{margin:0;font:800 clamp(25px,5vw,35px)/1.35 var(--serif);overflow-wrap:anywhere}
.interlude-mark{width:48px;height:48px;color:var(--gold)}
[data-mode="opening"] .interlude-mark{color:#88557a}
.interlude-card p{margin:0;color:var(--sub)}
.interlude-card .toast-stats{min-height:1.5em}
.interlude-card .btn{width:auto;min-width:100px}
[data-mode="opening"] .interlude-card .btn{background:transparent;color:inherit;border-color:#78516c}
.interlude canvas{position:fixed;inset:0;pointer-events:none}
.setting-switch{display:flex;align-items:center;gap:10px;font-size:15px;padding:8px 0}
.setting-switch input{width:20px;height:20px;margin:0;accent-color:var(--primary)}
@media(prefers-color-scheme:dark){
  .interlude[data-mode="opening"]{background:linear-gradient(144deg,#26233f,#4c3458 70%,#583b54)}
  [data-mode="opening"] .interlude-card,[data-mode="opening"] .interlude-mark{color:#f6dfe9}
  [data-mode="opening"] .interlude-card .btn{border-color:#c99ab9}
}
@media(prefers-reduced-motion:reduce){
  .focus-hero::before,.timer-paper::before,.hero-swapped{animation:none}
  .timer-paper .ring-fill{transition:none}
}
/* School assignments */
.school-nav{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.school-overdue{display:block;text-align:left;border:0;width:100%;color:var(--bad);
  background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.school-count{margin:0}
.school-summary{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;min-height:36px}
.school-summary .chip{padding-inline:9px}
.school-course{padding:12px;border-inline-start:4px solid var(--course-color);min-width:0}
.school-course summary{cursor:pointer;overflow-wrap:anywhere}
.school-heading{display:inline-flex;gap:4px 10px;flex-wrap:wrap;align-items:baseline;max-width:calc(100% - 22px);vertical-align:top}
.school-estimate{display:inline-flex;gap:3px 8px;flex-wrap:wrap;align-items:baseline;font-variant-numeric:tabular-nums}
.school-course-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.school-forecast{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.school-forecast .f{width:76px;padding:4px 6px}
.school-forecast strong{min-width:6ch;font-variant-numeric:tabular-nums}
.school-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:6px;padding:6px 4px;
  border-top:1px solid var(--line);border-radius:6px}
.school-row .iconbtn,.school-outline-row .iconbtn{min-height:44px}
.school-check{display:grid;place-items:center;min-height:44px;cursor:pointer}
.school-check input{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
.school-item{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.school-late{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:transparent}
.school-late .school-title,.school-late .school-due,.school-calendar-late{color:var(--bad)}
.school-submitted{background:var(--soft)}
.school-submitted .school-title{text-decoration:line-through;color:var(--faint)}
.school-outline-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(76px,25%) auto;gap:6px;align-items:end}

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const hm=t=>{if(!t)return null;const [h,m]=String(t).split(":").map(Number);return h*60+m;};
function sleepAt(settings=S.settings){ // bedtime in the current cycle, starting at day_start
  const st=settings||{}; const sl=hm(st.sleep_time)??1410, ds=hm(st.day_start)??480;
  const n=new Date(); const b=new Date(n.getFullYear(),n.getMonth(),n.getDate(),Math.floor(sl/60),sl%60);
  const beforeDayStart=n.getHours()*60+n.getMinutes()<ds;
  b.setDate(b.getDate()+(sl<ds?1:0)-(beforeDayStart?1:0));
  return b;
}
const minsLeftToSleep=()=>Math.round((sleepAt()-new Date())/60000);
const fmtMin=m=>m>=60?(Math.floor(m/60)+" 小时"+(m%60?" "+m%60+" 分":"")):m+" 分钟";
function dueText(t){
  if(!t.due_at) return "";
  const h=(new Date(t.due_at)-new Date())/36e5;
  const d=new Date(t.due_at);
  if(h<0) return "已过截止时间";
  if(ymd(d)===today()) return d.getHours()>=17?"今晚截止":"今天截止";
  if(ymd(d)===addDays(today(),1)) return "明天截止";
  const days=Math.ceil(h/24); return days<=7?days+" 天后截止":(d.getMonth()+1)+"月"+d.getDate()+"日截止";
}

let interludeTimer, interludeDone, previousFocus, confettiFrame;
function closeInterlude(){

function confetti(){
  const overlay=$("#interlude"), canvas=document.createElement("canvas");
  canvas.setAttribute("aria-hidden","true");
  const ctx=canvas.getContext?.("2d");
  if(!ctx) return;
  const w=overlay.clientWidth,h=overlay.clientHeight,ratio=Math.min(devicePixelRatio||1,2);
  canvas.width=w*ratio;canvas.height=h*ratio;canvas.style.width=w+"px";canvas.style.height=h+"px";
  overlay.append(canvas);ctx.scale(ratio,ratio);
  const colors=["#ce7a78","#dbad62","#8ebda3","#a88ac4","#7a9cc7"];
  const pieces=Array.from({length:60},(_,i)=>({
    x:(Math.random()-.5)*Math.min(w,620)*1.45,y:-(.65+Math.random())*h*.52,
    spin:(Math.random()-.5)*14,size:4+Math.random()*5,color:colors[i%colors.length]
  }));
  const start=performance.now();
  const frame=now=>{
    const t=(now-start)/1000;ctx.clearRect(0,0,w,h);
    if(t>=1||reduceMotion?.matches||!canvas.isConnected){if(canvas.isConnected) canvas.remove();confettiFrame=null;return;}
    ctx.globalAlpha=Math.min(1,(1-t)*4);
    for(const p of pieces){
      ctx.save();ctx.translate(w/2+p.x*t,h*.57+p.y*t+h*.86*t*t);ctx.rotate(p.spin*t);
      ctx.fillStyle=p.color;ctx.fillRect(0,0,p.size,p.size*.58);ctx.restore();
    }
    confettiFrame=requestAnimationFrame(frame);
  };
  confettiFrame=requestAnimationFrame(frame);
}

/* ---------- progress from stored sessions ---------- */
function progressValues(){
  const day=today(), start=+dayStart(day), end=+dayStart(addDays(day,1));
  const completed=S.tasks.filter(t=>t.status==="done"&&t.done_at&&ymd(new Date(t.done_at))===day).length;
  if(S.progress?.day!==day||!S.progress.rows) return {completed,minutes:null,streak:0};
  let ms=0;
  const days=new Set();
  for(const row of S.progress.rows){
    const finish=Date.parse(row.ended_at), begin=Date.parse(row.started_at);
    if(row.outcome==="skip"||!Number.isFinite(finish)||!(finish>=begin)) continue;
    days.add(ymd(new Date(finish)));
    ms+=Math.max(0,Math.min(finish,end)-Math.max(begin,start));
  }
  let cursor=days.has(day)?day:addDays(day,-1), streak=0;
  while(days.has(cursor)){streak++;cursor=addDays(cursor,-1);}
  return {completed,minutes:Math.round(ms/60000),streak,focusedToday:days.has(day)};
}
function progressMarkup(){
  const {completed,minutes,streak}=progressValues();
  return `<span>今天完成 <b>${completed} 件</b></span>
    <span>${minutes!==null?`专注 <b>${minutes} 分钟</b>`:S.progress?.error?"专注记录暂未读到":"正在读专注记录…"}</span>
    ${streak?`<span>连续 <b>${streak} 天</b></span>`:""}`;
}
function paintProgress(){
  const home=$("#today-progress"), ending=$("#completion-stats");
  if(home) home.innerHTML=progressMarkup();
  for(const view of ["projects","routines"]){
    const note=$(`[data-note-page="${view}"] span`);
    if(note) note.textContent=pageNoteText(view);
  }
  if(ending){
    const {completed,minutes}=progressValues();
    ending.textContent=`今天已完成 ${completed} 件 · ${minutes!==null?`专注 ${minutes} 分钟`:S.progress?.error?"专注记录暂未读到":"正在读专注记录…"}`;
  }
}
async function readProgress(){
  const user=S.user, day=today();
  const request={day,rows:S.progress?.day===day?S.progress.rows:null};
  S.progress=request;
  try{
    const rows=[], days=new Set(), size=100;
    let upper=addDays(day,1), checkFrom=addDays(day,-1);
    // Scan older dates only while the consecutive run reaches the current window.
    for(;;){
      const lower=addDays(upper,-32);
      for(let offset=0;;offset+=size){
        const {data,error}=await sb.from("sessions").select("id,started_at,ended_at,outcome")
          .gte("ended_at",dayStart(lower).toISOString()).lt("ended_at",dayStart(upper).toISOString())
          .order("ended_at",{ascending:false}).order("id").range(offset,offset+size-1);
        if(S.user!==user||S.progress!==request) return;
        if(error) throw error;
        rows.push(...data);
        for(const row of data) if(row.outcome!=="skip"&&Date.parse(row.ended_at)>=Date.parse(row.started_at)) days.add(ymd(new Date(row.ended_at)));
        if(data.length<size) break;
      }
      while(checkFrom>=lower&&days.has(checkFrom)) checkFrom=addDays(checkFrom,-1);
      if(checkFrom>=lower) break;
      upper=lower;
    }
    request.rows=rows;
  }catch(e){ request.error=true; }
  if(S.user===user&&S.progress===request) paintProgress();
}
function recordProgress(session){
  if(S.progress?.day===today()&&S.progress.rows){
    S.progress.rows=[session,...S.progress.rows.filter(row=>row.id!==session.id)];
  }
  void readProgress();
}

const taskOrder=(a,b)=>priorityOrder(a,b)||(dueOrder(a)-dueOrder(b))||(a.est_min||25)-(b.est_min||25);
function quadrantGrid(tasks){

const TIME_OPTIONS=[[10,"10 分钟"],[20,"20 分钟"],[45,"45 分钟"],[0,"不限"]];
const recommendationFilter=()=>load(userKey("recommendation"),{minutes:0,area:""});
function rank(){
  const now=new Date(), td=today(), e=S.energy, out=[];
  const {minutes,area}=recommendationFilter();
  const late=now.getHours()>=23||minsLeftToSleep()<=0;
  const rules=matchingRules(now);
  const fits=(m,a)=>(!minutes||(m>0&&m<=minutes))&&(!area||area===a);
  const wishes=[];
  for(const t of S.tasks){
    if(!availableTask(t)||!fits(t.est_min,t.area)||(late&&quadrant(t)!==1)) continue;
    if(t.plan_date&&t.plan_date>td) continue;
    if(t.kind==="wish"&&!t.plan_date){
      if(!late&&(minutes===0||minutes===45)&&t.est_min>0) wishes.push({kind:"task",item:t,why:"心愿单",boost:ruleBoost(rules,t,false)});
      continue;
    }
    let s=0, why="";
    if(t.due_at){const h=(new Date(t.due_at)-now)/36e5;
      if(h<0){s+=95;why="已过截止时间";} else if(h<12){s+=90;why=dueText(t);} else if(h<36){s+=60;why=dueText(t);} else if(h<72){s+=35;why=dueText(t);} }
    if(t.plan_date===td){s+=40;why=why||"排在今天";}
    else if(t.plan_date&&t.plan_date<td){s+=30;why=why||"之前没做完";}
    if(t.status==="doing"||t.next_step){s+=15;why=why||"接着上次";}
    s+=[0,95,40,20,0][quadrant(t)];
    const pressing=urgent(t);
    if(e==="low"&&!pressing){ if((t.est_min||30)>30) s-=40; if(t.energy==="high") s-=30; if(t.energy==="low") s+=15; }
    if(e==="mid"&&(t.est_min||0)>90) s-=10;
    if(e==="high"&&t.energy==="high") s+=10;

    const boost=ruleBoost(rules,t,false);
    out.push({kind:"task",item:t,score:s+boost*30,boost,why:why||(boost?"符合你的规则":"")});
  }
  if(!late) for(const a of S.acts){
    const boost=ruleBoost(rules,a,true);
    if(!a.active||a.archived||!fits(a.minutes,a.area)||(e==="high"&&!boost)) continue;
    out.push({kind:"act",item:a,score:(e==="low"?55:12)*(a.weight||1)+boost*120,
      why:boost?"符合你的规则":e==="low"?"累了，做点不费脑的":"换换脑子"});
  }
  const tasks=out.filter(p=>p.kind==="task").sort((a,b)=>priorityOrder(a.item,b.item)||
    (quadrant(a.item)===1?dueOrder(a.item)-dueOrder(b.item):b.boost-a.boost)||(dueOrder(a.item)-dueOrder(b.item))||b.score-a.score||taskOrder(a.item,b.item));
  if(!tasks.some(p=>urgent(p.item))) tasks.push(...wishes.sort((a,b)=>b.boost-a.boost||taskOrder(a.item,b.item)));
  const cards=out.filter(p=>p.kind==="act").sort((a,b)=>b.score-a.score);
  const firstCard=tasks.findIndex(p=>quadrant(p.item)!==1&&(p.score??(e==="low"?0:35))<(cards[0]?.score??-Infinity));
  if(firstCard<0) return [...tasks,...cards];
  return [...tasks.slice(0,firstCard),...cards,...tasks.slice(firstCard)];
}

/* ---------- data ---------- */
async function q(p,label){
  const user=S.user, r=await p;
  if(S.user!==user) throw new Error("Session changed");
  if(r.error){ toast((label||"没保存上")+"："+(r.error.message||"出错")); throw r.error; }
  return r.data;
}
async function readWebPages(buildQuery){
  const all=[], limit=1000;
  for(let offset=0;;offset+=limit){
    const result=await buildQuery().range(offset,offset+limit-1);
    if(result.error) throw result.error;
    all.push(...result.data);
    if(result.data.length<limit) return all;
  }
}
const readSchoolOutlines=()=>readWebPages(()=>sb.from("course_outlines").select("*").order("course").order("category"));
async function loadAll(){
  const user=S.user, uid=user.id, revision=S.revision;
  let [tasks,acts,settings,sessions,caps]=await Promise.all([
    readWebPages(()=>sb.from("tasks").select("*").neq("status","dropped").order("created_at").order("id")),
    q(sb.from("activities").select("*").order("created_at"),"读取失败"),
    q(sb.from("settings").select("*").maybeSingle(),"读取失败"),
    q(sb.from("sessions").select("*").is("ended_at",null).order("started_at",{ascending:false}).limit(1),"读取失败"),
    q(sb.from("captures").select("*").is("processed_at",null).order("created_at"),"读取失败")]);
  if(S.user!==user) return;
  if(!settings){
    await q(sb.from("settings").upsert({user_id:uid},{onConflict:"user_id",ignoreDuplicates:true}));
    settings=await q(sb.from("settings").select("*").single(),"读取失败");
  }
  if(S.user!==user) return;
  if(!acts.length){
    await q(sb.rpc("seed_web_activities",{p_cards:DEFAULT_ACTIVITIES}),"活动卡没建好");
    acts=await q(sb.from("activities").select("*").order("created_at"),"读取失败");
  }
  for(const c of caps){ // Siri/watch captures become inbox tasks
    if(S.user!==user) return;
    const external_id="capture:"+c.id;
    const inserted=await q(sb.from("tasks").upsert({user_id:uid,external_id,title:c.text.slice(0,300),status:"inbox",source:c.source||"siri"},
      {onConflict:"user_id,external_id",ignoreDuplicates:true}).select());
    const t=inserted[0]||await q(sb.from("tasks").select("*").eq("external_id",external_id).single());
    if(S.user!==user) return;
    await q(sb.from("captures").update({processed_at:new Date().toISOString(),task_id:t.id}).eq("id",c.id));
    if(t.status!=="dropped"&&!tasks.some(row=>row.id===t.id)) tasks.push(t);
  }
  if(S.user!==user||S.revision!==revision) return;
  try{({tasks,settings}=await generateRoutines(tasks,settings));}catch(e){}
  if(!sessions.length&&settings.nudge_day!==today()&&tasks.some(nudgeEligible)){
    try{
      const r=await q(sb.rpc("web_nudge",{p_day:today(),p_action:"claim"}),"提醒没更新");
      settings=r.settings;
      if(r.task) tasks=tasks.map(t=>t.id===r.task.id?r.task:t);
    }catch(e){}
  }
  let rules=S.rules, rulesError=false;
  try{rules=await q(sb.from("web_rules").select("*"),"没读到规则");}
  catch(e){rulesError=true;}
  let outlines=S.outlines, outlineError=false;
  try{outlines=await readSchoolOutlines();}
  catch(e){outlineError=true;}
  if(S.user!==user||S.revision!==revision) return;
  Object.assign(S,{tasks,acts,rules,rulesError,outlines,outlineError,settings,session:sessions[0]||null});
  S.loaded=true;
  void readProgress();
}
async function readAll(){
  const user=S.user;
  if(!user||S.loading===user) return;
  S.loading=user;
  try{ await loadAll(); }
  finally{ if(S.loading===user) S.loading=null; }
}
async function refresh(){
  if(!S.loaded||S.busy||S.loading||S.restoring) return;
  const user=S.user;
  try{
    await readAll();
    if(S.user!==user||S.busy) return;
    if(S.view==="cal"&&S.rec.day===calendarDay()&&!S.rec.loading&&!S.rec.error) {
      await loadRecord(calendarDay(),true);
    }else{
      if(S.view==="projects") S.projectTime=null;
      if(S.view==="activities") S.activityLikes=null;
      render();
    }
  }catch(e){}
}

function patchLocal(id,data){ const t=S.tasks.find(x=>x.id===id); if(t) Object.assign(t,data); }
async function updTask(id,data,label){ const r=await q(sb.from("tasks").update(data).eq("id",id).select().single(),label); patchLocal(id,r); return r; }
async function createTask(data,draftType){
  const key=userKey("pendingTask."+draftType), previous=load(key,null);
  // done_at is assigned at submit time, so it is not part of the draft identity.
  const signature=JSON.stringify({...data,done_at:undefined});
  const id=previous?.signature===signature?previous.id:crypto.randomUUID();
  save(key,{id,signature});
  const inserted=await q(sb.from("tasks").upsert({...data,id,user_id:S.user.id},{onConflict:"id",ignoreDuplicates:true}).select());
  const t=inserted[0]||await q(sb.from("tasks").select("*").eq("id",id).single());
  if(S.tasks.some(row=>row.id===id)) patchLocal(id,t);
  else if(t.status!=="dropped") S.tasks.push(t);
  save(key,null);
}

function recommendationReason(p,mins){
  const t=p.item, until=Date.parse(t.due_at)-Date.now();
  if(p.kind==="task"&&Number.isFinite(until)&&until<72*36e5){
    if(until<0) return "已过截止时间 · 先做 "+fmtMin(mins);
    const due=new Date(t.due_at), day=ymd(due);
    const label=day===today()?"今天":day===addDays(today(),1)?"明天":(due.getMonth()+1)+"月"+due.getDate()+"日";
    return label+" "+pad(due.getHours())+":"+pad(due.getMinutes())+" 截止 · 先做 "+fmtMin(mins);
  }
  if(p.why) return p.why+" · 约 "+fmtMin(mins);
  const idle=(Date.parse(today())-Date.parse(ymd(new Date(t.updated_at||t.created_at))))/864e5;
  if(idle>=5) return "已有 "+idle+" 天没更新 · 约 "+fmtMin(mins);
  return "现在可以留出 "+fmtMin(mins);
}

function startTick(){ stopTick(); const f=()=>{ const s=S.session; if(!s) return;
  const end=new Date(s.started_at).getTime()+s.planned_min*60000, ms=end-Date.now(), over=ms<0, a=Math.abs(ms);
  const c=$("#clock"), sub=$("#clocksub"), arc=$("#arc"); if(!c) return;
  c.textContent=pad(Math.floor(a/60000))+":"+pad(Math.floor(a/1000)%60);
  sub.textContent=over?"超时了，想停就停":"还剩";
  arc.setAttribute("stroke-dashoffset",String(578*(over?1:1-ms/(s.planned_min*60000))));

const WEEKDAYS=[[1,"周一"],[2,"周二"],[3,"周三"],[4,"周四"],[5,"周五"],[6,"周六"],[7,"周日"]];
const eventOn=(ev,day)=>!ev.archived&&(ev.on_date===day||(!ev.on_date&&ev.repeat_days?.includes(isoDow(day))&&
  (!ev.valid_from||ev.valid_from<=day)&&(!ev.valid_until||day<=ev.valid_until)));
const clockLabel=m=>m===1440?"24:00":pad(Math.floor(m/60))+":"+pad(m%60);
function freeSlots(day,events,tasks,settings,scheduleFrom=null){
  if(day<today()) return [];
  const start=hm(settings.day_start)??480, sleep=hm(settings.sleep_time)??1410;
  const windows=sleep<start?[[0,sleep],[start,1440]]:[[start,sleep]];
  const now=new Date(), nowMin=wallMinutes(now)+(now.getSeconds()||now.getMilliseconds()?1:0);
  const bedtime=sleepAt(settings), bedtimeDay=ymd(bedtime);
  const first=day===today()?Math.max(nowMin,scheduleFrom??0):0;
  const last=day===today()?(bedtimeDay<day?0:bedtimeDay===day?wallMinutes(bedtime):1440):1440;
  const busy=events.filter(e=>eventOn(e,day)).map(e=>[hm(e.start_time),hm(e.end_time)]);
  for(const t of tasks){
    if(t.plan_date===day&&t.plan_start&&!["done","dropped","someday","inbox"].includes(t.status)&&!["project","routine"].includes(t.kind)){
      const s=hm(t.plan_start);busy.push([s,s+(t.est_min||25)]);
    }
  }
  busy.sort((a,b)=>a[0]-b[0]);
  const slots=[];
  for(const [start,end] of windows){
    let cursor=Math.max(start,first);const limit=Math.min(end,last);
    for(const [a,b] of busy){
      if(b<=cursor) continue;
      if(a>=limit) break;
      if(a>cursor) slots.push([cursor,a]);
      cursor=Math.max(cursor,b);
    }
    if(cursor<limit) slots.push([cursor,limit]);
  }
  return slots;
}
function reserveSlot(slots,minutes,limit=1440){
  const slot=slots.find(([start,end])=>start+minutes<=Math.min(end,limit));
  if(!slot) return null;
  const start=slot[0];slot[0]+=minutes;
  return clockLabel(start);
}
const routineDays=t=>t.routine_days||WEEKDAYS.map(([day])=>day);
const activeRoutine=t=>t.kind==="routine"&&t.status!=="dropped"&&!t.routine_paused;
const routineOrder=(a,b)=>(a.routine_priority??2)-(b.routine_priority??2)||taskOrder(a,b)||a.title.localeCompare(b.title,"zh");
async function generateRoutines(tasks,settings){
  const day=today();
  const templates=tasks.filter(t=>activeRoutine(t)&&routineDays(t).includes(isoDow(day))).sort(routineOrder);
  if(!templates.length||settings.routine_generated_day>=day) return {tasks,settings};
  const events=await q(sb.from("events").select("*"),"没读到固定日程");
  const slots=freeSlots(day,events,tasks,settings), plan=[];
  for(const t of templates){
    const start=reserveSlot(slots,t.est_min||25);
    if(start!==null) plan.push({template_id:t.id,start});
  }
  const result=await q(sb.rpc("web_generate_routines",{p_day:day,p_plan:plan,p_now:localTimestamp()}),"例行没生成");
  const generated=new Set(result.tasks.map(t=>t.id));
  return {tasks:[...tasks.filter(t=>!generated.has(t.id)),...result.tasks.filter(t=>t.status!=="dropped")],settings:result.settings};

  if(a==="routine-skip") return changeTask(t.id,{status:"dropped"},"这次例行已跳过",{status:t.status});

const WISH_FILTER={q:"",area:"",time:"all",hide:true,sort:"short"};
const weekStart=day=>addDays(day,1-isoDow(day));
const weekDays=day=>Array.from({length:7},(_,i)=>addDays(weekStart(day),i));
const taskMinutes=t=>t.est_min||25;
function placeTasks(tasks,days,events,busy=S.tasks,settings=S.settings,scheduleFrom=null){
  const now=new Date();
  const free=new Map(days.map(day=>[day,freeSlots(day,events,busy,settings,scheduleFrom)]));
  const plan=[];
  for(const t of tasks){
    for(const day of days){
      const due=t.due_at&&Date.parse(t.due_at)>=now?new Date(t.due_at):null;
      const limit=due&&ymd(due)===day&&day>=today()?wallMinutes(due):1440;
      if(due&&day>ymd(due)) break;
      const start=reserveSlot(free.get(day),taskMinutes(t),limit);
      if(start!==null){
        plan.push({...planBaseline(t),day,start});
        break;
      }
    }
  }
  return plan;
}

const APP_COLORS={"抖音":"#D4537E","小红书":"#E24B4A","B站":"#378ADD","YouTube":"#A32D2D","TikTok":"#444441"};
const appColor=a=>Object.hasOwn(APP_COLORS,a)?APP_COLORS[a]:"#888780";
const dayStart=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const isoDow=s=>{const g=dayStart(s).getDay();return g===0?7:g;};

async function loadRecord(day,keepRows=false){
  const [from,to]=calendarRange(day), si=dayStart(from).toISOString(), ei=dayStart(to).toISOString();
  const request=keepRows?{...S.rec,day,loading:true,error:false}:{day,loading:true};
  S.rec=request;
  try{
    const [usage,sessions,events]=await Promise.all([
      q(sb.from("app_usage").select("*").lt("started_at",ei).or(`ended_at.gt.${si},ended_at.is.null`).order("started_at"),"读取记录失败"),
      q(sb.from("sessions").select("*").lt("started_at",ei).or(`ended_at.gt.${si},ended_at.is.null`).order("started_at"),"读取记录失败"),
      q(sb.from("events").select("*"),"读取日程失败")]);
    Object.assign(request,{usage,sessions,events});
  }catch(err){ request.error=true; }
  request.loading=false;
  if(S.rec!==request) return;
  if(S.view==="cal") render();
}
const wallMinutes=t=>t.getHours()*60+t.getMinutes();
function recordSpan(start,end,d0,d1){
  const from=Math.max(Date.parse(start),+d0), to=Math.min(+end,+d1);
  if(!(to>from)) return null;
  const s=wallMinutes(new Date(from)), e=to===+d1?1440:wallMinutes(new Date(to));
  return {s,e:Math.max(s,e),minutes:(to-from)/60000};
}
function calendarRecords(day,record){
  const d0=dayStart(day), d1=dayStart(addDays(day,1)), now=new Date();
  const rec=[], perApp=new Map(); let fun=0, work=0;
    for(const u of (record.usage||[])){ const cap=Date.parse(u.started_at)+3*36e5, en=Math.min(u.ended_at?Date.parse(u.ended_at):+now,cap);
      const span=recordSpan(u.started_at,en,d0,d1); if(!span) continue;
      rec.push({...span,title:u.app,color:appColor(u.app),open:!u.ended_at&&day===today()&&now<cap});
      perApp.set(u.app,(perApp.get(u.app)||0)+span.minutes); fun+=span.minutes; }
    for(const x of (record.sessions||[])){ const en=x.ended_at?Date.parse(x.ended_at):+now;
      const span=recordSpan(x.started_at,en,d0,d1); if(!span) continue;
      const tk=S.tasks.find(t=>t.id===x.task_id), ac=S.acts.find(a=>a.id===x.activity_id);
      rec.push({...span,title:tk?tk.title:ac?ac.title:"做事",soft:true}); work+=span.minutes; }
  return {rec,perApp,fun,work};
}

async function insertRecord(table,data,type){
  const key=userKey("pendingRecord."+type), previous=load(key,null), signature=JSON.stringify(data);
  const id=previous?.signature===signature?previous.id:crypto.randomUUID();
  save(key,{id,signature});
  const rows=await q(sb.from(table).upsert({...data,id,user_id:S.user.id},{onConflict:"id",ignoreDuplicates:true}).select());
  const row=rows[0]||await q(sb.from(table).select("*").eq("id",id).single());
  save(key,null);
  return row;
}

  const key=planDraftKey(), current=load(key,null);
  const draft=!force&&current?.day===today()&&current.scope===scope?current:null;
  if(draft){paintPlanner(draft);return;}
  const request={};
  S.planRequest=request;
  openSheet(`<h2>帮我排</h2>${selectedButtons("planner-scope",PLAN_SCOPE,scope,"","安排范围")}
    <p class="sub">正在找空闲时间…</p><button class="btn" data-act="close-sheet">关闭</button>`,{type:"planner",scope});
  void (async()=>{
    try{
      const events=await q(sb.from("events").select("*"),"没读到固定日程");
      if(S.planRequest!==request||$("#sheet").hidden) return;
      const days=scopeDays(scope), candidates=planCandidates(days);
      const earliest=Math.ceil((wallMinutes(new Date())+plannerLead)/5)*5;
      const slots=placeTasks(candidates,days,events,S.tasks,S.settings,earliest);
      const next={day:today(),scope,rows:slots.map(row=>({...row,choice:"pending",excluded:[]}))};
      save(key,next);paintPlanner(next);
    }catch(e){
      if(S.planRequest===request&&!$("#sheet").hidden){
        openSheet(`<h2>帮我排</h2><p class="sub">没读到固定日程，暂时不能预览。</p>
          ${actionButton("planner-refresh","重试",scope)}<button class="btn" data-act="close-sheet">关闭</button>`,{type:"planner",scope});
      }
    }
  })();
}
function paintPlanner(draft){
  S.planRequest=null;
  const rows=draft.rows.filter(row=>S.tasks.some(t=>t.id===row.id&&availableTask(t)));
  const pending=rows.filter(row=>row.choice==="pending").length, accepted=rows.filter(row=>row.choice==="yes").length;
  openSheet(`<h2>帮我排</h2>${selectedButtons("planner-scope",PLAN_SCOPE,draft.scope,"","安排范围")}
    ${rows.length?`<p class="sub">预览有 ${rows.length} 条，${pending} 条待选择。选好后再保存。</p>
     <div class="list" id="planner-rows">${rows.map(row=>{
       const t=S.tasks.find(t=>t.id===row.id);
       return `<section class="project-child"><div class="meta"><i class="dot" style="background:${areaColor(t.area)}"></i>${esc(t.area||"其他")}</div><p class="note">${esc(t.title)}</p>
         <p class="sub">${row.day.slice(5)} ${row.start} · ${fmtMin(taskMinutes(t))}</p>
         ${selectedButtons("planner-choice",[["yes","好"],["swap","换一个"],["no","不排"]],row.choice,row.id,"选择 "+t.title)}</section>`;
     }).join("")}</div>`:'<p class="empty">没有待排任务，或剩余空闲时间放不下。</p>'}
    <p class="err" id="planner-err"></p>
    <button class="btn primary" data-act="planner-commit" ${pending||!accepted?"disabled":""}>就这样</button>
    ${actionButton("planner-refresh","重新预览",draft.scope)}
    <button class="btn" data-act="close-sheet">关闭</button>`,{type:"planner",scope:draft.scope});
}
async function plannerAction(a,el){
  const v=el.dataset.v, key=planDraftKey(), draft=load(key,null);
  if(a==="planner-open") return plannerSheet();
  if(a==="planner-scope"||a==="planner-refresh"){
    save(userKey("plannerScope"),v);
    return plannerSheet(true,v);
  }
  if(!draft||draft.day!==today()){return plannerSheet(true);}
  if(a==="planner-choice"){
    const row=draft.rows.find(r=>r.id===el.dataset.id);
    if(!row) return;
    if(v!=="swap"){row.choice=v;save(key,draft);paintPlanner(draft);return;}
    if(!beginWrite()) return;
    try{
      const events=await q(sb.from("events").select("*"),"没读到固定日程");
      const days=scopeDays(draft.scope), used=new Set([...draft.rows.map(r=>r.id),...row.excluded]);
      const candidates=planCandidates(days).filter(t=>!used.has(t.id));
      const occupied=draft.rows.filter(r=>r!==row&&r.choice!=="no").flatMap(r=>{
        const t=S.tasks.find(task=>task.id===r.id);
        return t?[{...t,plan_date:r.day,plan_start:r.start}]:[];
      });
      const earliest=Math.ceil((wallMinutes(new Date())+plannerLead)/5)*5;
      const [replacement]=placeTasks(candidates,days,events,[...S.tasks,...occupied],S.settings,earliest);
      if(!replacement){toast("没有另一件放得下的待办。");return;}
      row.excluded.push(row.id);Object.assign(row,replacement,{choice:"pending"});
      save(key,draft);paintPlanner(draft);
    }catch(e){}finally{S.busy=false;}
    return;
  }
  const rows=draft.rows.filter(row=>S.tasks.some(t=>t.id===row.id&&availableTask(t)));
  const accepted=rows.filter(row=>row.choice==="yes");
  if(rows.some(row=>row.choice==="pending")||!accepted.length||!beginWrite()) return;
  el.disabled=true;
  try{
    await writePlan(accepted);
    save(key,null);closeSheet();render();
    toast(`已安排 ${accepted.length} 条`,{label:"撤销",fn:()=>undoPlan(accepted)});
  }catch(e){
    $("#planner-err").textContent="计划或时间有变化。请重新预览后再保存。";el.disabled=false;
  }finally{S.busy=false;}
}

    <div class="sum">${ready?`<span>娱乐 <b>${fmtMin(Math.round(fun))}</b></span>${[...perApp].sort((a,b)=>b[1]-a[1]).map(([a,m])=>`<span><i class="dot" style="background:${appColor(a)}"></i>${esc(a)} ${Math.round(m)} 分</span>`).join("")}<span>做事 <b>${fmtMin(Math.round(work))}</b></span>`:failed?`<span class="sub">没读到这一天的记录。</span><button class="btn small" data-act="retry-record">重试</button>`:`<span class="sub">正在读取这一天的记录…</span>`}</div>
    ${unscheduled.length?`<div><p class="label" style="margin:0 0 4px">计划了、没定时间</p><div class="list">${unscheduled.map(t=>`<button class="row${t.status==="done"?" done":""}" data-act="edit" data-id="${t.id}"><span class="dot" style="background:${areaColor(t.area)}"></span><span class="t">${esc(t.title)}</span><span class="faint">${t.status==="done"?"已完成":t.est_min?fmtMin(t.est_min):""}</span></button>`).join("")}</div></div>`:""}
    ${schoolCalendar(day,f)}

/* ---------- school assignments ---------- */
const UNCLASSIFIED_COURSE="未分类课程";
const SCHOOL_FILTER={q:"",course:"",state:"all",sort:"soon",hideSubmitted:false};
const SCHOOL_STATES=[["all","全部"],["open","没交"],["late","已过期"],["submitted","已交"]];
const SCHOOL_FIELDS=["school_course","grade_category","grade_weight","score","score_max","submitted_at"];
const SCHOOL_ITEM_PREFIXES=new Set(["LAB","LABS","QUIZ","TEST","EXAM","UNIT","WEEK","TASK","PROJECT","MIDTERM","FINAL","HOMEWORK"]);
const schoolFilter=()=>({...SCHOOL_FILTER,...load(userKey("schoolFilter"),{})});
const schoolNumberFormat=new Intl.NumberFormat("zh-CN",{maximumFractionDigits:2});
const schoolText=value=>value.normalize("NFKC").trim().replace(/\s+/g," ");
const schoolKey=value=>schoolText(value).toLowerCase();
const schoolCourseCode=/(?<![A-Z0-9])([A-Z]{2,8})[ _-]*(\d{3,4}[A-Z]?)(?![A-Z0-9])/gi;
function courseCode(title){
  // Blackboard commonly prefixes a course code. Avoid interpreting item names as departments.
  const normalized=title.normalize("NFKC");
  return [...normalized.matchAll(schoolCourseCode)].find(match=>{
    const department=match[1].toUpperCase();
    const suffix=normalized.slice(match.index+match[0].length).trimStart();
    return !SCHOOL_ITEM_PREFIXES.has(department)&&
      (match[1]===department||!match[0].includes(" ")||/^[：:]/.test(suffix));
  });
}
function schoolCourse(t){
  if(t.school_course) return t.school_course;
  const code=courseCode(t.title);
  return code?(code[1]+"-"+code[2]).toUpperCase():UNCLASSIFIED_COURSE;
}
const schoolTask=t=>visibleTask(t)&&t.kind==="deadline"&&
  (["学校","课程"].includes(t.area)||["blackboard","school-json"].includes(t.source)||!!t.school_course);
const schoolTasks=()=>S.tasks.filter(schoolTask);
const schoolOutline=course=>S.outlines.filter(row=>schoolKey(row.course)===schoolKey(course));
const schoolPast=(t,now=Date.now())=>!t.submitted_at&&dueOrder(t)<now;
const schoolPercent=value=>schoolNumberFormat.format(value)+"%";
function schoolColor(course){
  const hash=Array.from(schoolKey(course)).reduce((sum,c)=>(Math.imul(sum,31)+c.codePointAt(0))>>>0,0);
  return "hsl("+(hash*137%360)+" 52% 48%)";
}
const schoolFieldValues=(t,fields=SCHOOL_FIELDS)=>Object.fromEntries(fields.map(field=>[field,t?.[field]??null]));
const schoolSame=(a,b)=>a===b||(a!=null&&b!=null&&String(a)===String(b));
function schoolChangedFields(before,after){
  const fields=Object.keys(after).filter(field=>!schoolSame(before[field],after[field]));
  if(fields.includes("score")||fields.includes("score_max")) return [...new Set([...fields,"score","score_max"])];
  return fields;
}
function schoolTaskPatch(id,before,after){
  const fields=schoolChangedFields(before,after);
  if(fields.length) return {id,before:schoolFieldValues(before,fields),after:schoolFieldValues(after,fields)};
  return null;
}
function schoolCourseName(value){
  const name=schoolText(value), code=courseCode(name.toUpperCase());
  const normalized=code?.[0]===name.toUpperCase()?code[1]+"-"+code[2]:name;
  return [...S.outlines.map(row=>row.course),...schoolTasks().map(schoolCourse)]
    .find(course=>schoolKey(course)===schoolKey(normalized))??normalized;
}
function schoolItemTitle(t){
  const title=t.title.normalize("NFKC"), code=courseCode(title);
  if(!code) return t.title;
  return (title.slice(0,code.index)+" "+title.slice(code.index+code[0].length))
    .replace(/^[\s:：._–—\-()[\]]+|[\s:：._–—\-()[\]]+$/g,"")||t.title;
}
function schoolDueLabel(t,now){
  if(!t.due_at) return "没有截止时间";
  const due=new Date(t.due_at), day=ymd(due);
  const days=(Date.parse(day)-Date.parse(ymd(new Date(now))))/864e5;
  const date=days===0?"今天":days===1?"明天":days===-1?"昨天":
    days>1&&days<=7?days+" 天后":day;
  return date+" "+pad(due.getHours())+":"+pad(due.getMinutes());
}
const schoolLateLabel=(t,now)=>`已过期 ${Math.floor((now-dueOrder(t))/864e5)} 天`;
function schoolEstimate(tasks,outline,forecast){
  if(!outline.length) return {message:"缺少大纲"};
  const categories=new Map(outline.map(row=>[schoolKey(row.category),{total:+row.weight,explicit:0,items:[]}]));
  let total=outline.reduce((sum,row)=>sum+Number(row.weight),0);
  let known=0, earned=0;
  const count=(t,weight)=>{
    if(t.score==null||t.score_max==null||t.score_max<=0) return;
    known+=weight;
    earned+=weight*(t.score/t.score_max);
  };
  for(const t of tasks){
    const category=t.grade_category&&categories.get(schoolKey(t.grade_category));
    if(t.grade_weight!=null){
      const weight=Number(t.grade_weight);
      if(category) category.explicit+=weight;
      else total+=weight;
      count(t,weight);
    }else if(category) category.items.push(t);
  }
  if(total>100+1e-8||[...categories.values()].some(c=>c.explicit>c.total+1e-8)){
    return {message:"权重超出 100% 或类别占比"};
  }
  for(const {total,explicit,items} of categories.values()){
    if(!items.length) continue;
    const weight=Math.max(0,total-explicit)/items.length;
    for(const t of items) count(t,weight);
  }
  return {message:known>0?schoolPercent(earned/known*100):"暂无已出分的加权作业",known,
    final:earned+Math.max(0,100-known)*forecast/100,
    unweighted:tasks.filter(t=>t.score!=null&&t.grade_weight==null&&
      (!t.grade_category||!categories.has(schoolKey(t.grade_category)))).length};
}
function schoolEstimateMarkup(estimate){
  if(estimate.known==null) return `<span class="sub">${estimate.message}</span>`;
  return `<span class="school-estimate"><strong>${estimate.known>0?"估算成绩 ":""}${estimate.message}</strong><span class="sub">已出分部分占总评的 ${schoolPercent(estimate.known)}${estimate.unweighted?` · ${estimate.unweighted} 份已出分作业缺少权重`:""}</span></span>`;
}
const schoolForecastKey=course=>userKey("schoolForecast."+schoolKey(course));
function schoolForecastValue(course){
  const value=load(schoolForecastKey(course),"80");
  return value!==""&&Number(value)>=0&&Number(value)<=100?Number(value):80;
}
function schoolRow(t,now){
  const late=schoolPast(t,now), submitted=!!t.submitted_at, title=schoolItemTitle(t);
  return `<div class="school-row${late?" school-late":submitted?" school-submitted":""}" data-school-id="${esc(t.id)}">
    <label class="school-check"><input type="checkbox" data-school-submit="${esc(t.id)}" aria-label="已交 ${esc(title)}" ${submitted?"checked":""}></label>
    <div class="school-item"><strong class="school-title">${esc(title)}</strong>
      <span class="sub school-due">${esc(schoolDueLabel(t,now))}${late?" · "+schoolLateLabel(t,now):submitted?" · 已交":""}</span>
      <span class="sub">${t.grade_category?esc(t.grade_category)+" · ":""}${t.score!=null?esc(t.score)+" / "+esc(t.score_max):"未出分"}${t.grade_weight!=null?" · "+schoolPercent(t.grade_weight):""}</span></div>
    <button class="iconbtn" data-act="school-edit" data-id="${esc(t.id)}" aria-label="编辑 ${esc(title)}">编辑</button></div>`;
}
function schoolView(){
  const tasks=schoolTasks(), f=schoolFilter(), now=Date.now(), groups=new Map();
  for(const row of [...tasks.map(t=>[schoolCourse(t),t]),...S.outlines.map(o=>[o.course,null])]){
    const [course,task]=row, key=schoolKey(course);
    if(!groups.has(key)) groups.set(key,{course,tasks:[]});
    if(task) groups.get(key).tasks.push(task);
  }
  const selectedCourse=groups.has(f.course)?f.course:"";
  const groupsShown=[...groups].filter(([key])=>!selectedCourse||selectedCourse===key)
    .sort(([,a],[,b])=>a.course.localeCompare(b.course,"zh-CN",{numeric:true}));
  const late=tasks.filter(t=>schoolPast(t,now)).length, submitted=tasks.filter(t=>t.submitted_at).length;
  const rows=groupsShown.flatMap(([key,group])=>{
    const {course}=group, outline=schoolOutline(course), forecast=schoolForecastValue(course);
    const estimate=S.outlineError?{message:"大纲暂未读到"}:schoolEstimate(group.tasks,outline,forecast);
    const visible=group.tasks.filter(t=>
      (!f.hideSubmitted||!t.submitted_at)&&
      (f.state==="all"||(f.state==="late"?schoolPast(t,now):f.state==="submitted"?!!t.submitted_at:!t.submitted_at))&&
      matchesSearch([t.title,course,t.grade_category||""].join(" "),f.q))
      .sort((a,b)=>{
        const left=dueOrder(a), right=dueOrder(b);
        if(left===right) return a.title.localeCompare(b.title,"zh-CN",{numeric:true});
        if(!Number.isFinite(left)) return 1;
        if(!Number.isFinite(right)) return -1;
        return f.sort==="late"?right-left:left-right;
      });
    if(!visible.length&&(group.tasks.length||f.state!=="all"||f.q.trim())) return [];
    const collapsed=load(userKey("schoolGroup."+key),false);
    return [`<section class="focus school-course" style="--course-color:${schoolColor(course)}">
      <details data-school-group="${esc(key)}" ${collapsed?"":"open"}>
        <summary><span class="school-heading"><strong>${esc(course)}</strong><span class="sub">已交 ${group.tasks.filter(t=>t.submitted_at).length} / ${group.tasks.length}</span>
        ${schoolEstimateMarkup(estimate)}</span></summary>
        <div class="school-course-tools">${actionButton("school-outline","课程大纲",course)}
        ${estimate.known==null?"":`<label class="school-forecast sub">剩余拿到 <input class="f" type="number" min="0" max="100" step="any" inputmode="decimal" data-school-forecast="${esc(course)}" value="${esc(load(schoolForecastKey(course),"80"))}">%，最终 <strong data-school-final>${schoolPercent(estimate.final)}</strong></label>`}</div>
        ${visible.map(t=>schoolRow(t,now)).join("")||'<p class="empty">这门课还没有作业。</p>'}
      </details></section>`];
  });
  return `<div class="top"><button class="iconbtn" data-act="home">‹ 返回</button><h1 class="title">作业</h1>
    <button class="iconbtn" data-act="school-import">导入</button></div>
    ${pageNote("school")}
    <div class="school-summary"><p class="sub school-count" aria-live="polite">共 ${tasks.length} 份 · 已交 ${submitted} 份 · 过期 ${late} 份</p>
    ${load(userKey("schoolUndo"),null)?actionButton("school-undo","撤销上次变更"):""}</div>
    ${S.outlineError?`<p class="warnbox">课程大纲暂未读到。 ${actionButton("school-retry","重试")}</p>`:""}
    <input class="f" id="schoolq" type="search" aria-label="搜索作业" placeholder="搜索作业、课程或类别" value="${esc(f.q)}">
    <div class="grid2"><label><span class="fl">课程</span><select class="f" id="school-course-filter">
      ${selectOptions([["","全部课程"],...[...groups].map(([key,g])=>[key,g.course])],selectedCourse)}</select></label>
      <label><span class="fl">截止时间排序</span><select class="f" id="school-sort">
      ${selectOptions([["soon","最早截止在前"],["late","最晚截止在前"]],f.sort)}</select></label></div>
    <div class="chips">${selectedButtons("school-filter",SCHOOL_STATES,f.state,"","提交状态")}
      <button class="chip" data-act="school-hide" aria-pressed="${f.hideSubmitted}">隐藏已交</button></div>
    ${rows.join("")||`<p class="empty">${groups.size?"没有符合筛选条件的作业。":"还没有学校作业。Blackboard 日历同步后会出现在这里，也可以导入作业 JSON。"}</p>`}`;
}

function schoolCalendar(day,filter){
  const now=Date.now(), tasks=schoolTasks().filter(t=>t.due_at&&ymd(new Date(t.due_at))===day&&
    (!filter.area||t.area===filter.area)&&(!filter.hideDone||!t.submitted_at)).sort((a,b)=>dueOrder(a)-dueOrder(b));

function applySchoolChanges(result){

    if(task.status==="dropped") S.tasks=S.tasks.filter(row=>row.id!==task.id);

  for(const row of result.outline){

function invertSchoolChanges(batch,result){

      const task=result.tasks.find(t=>t.id===change.id);
      return {id:change.id,version:task.updated_at,before:{...change.after,status:"todo"},after:{...change.after,status:"dropped"}};

async function commitSchoolChanges(batch,{controls=[],errorField=null,message="作业变更已保存",onSaved=()=>{},undo=false}={}){

  if(errorField) errorField.textContent="";
  try{
    const result=await schoolWrite(batch);
    if(S.user!==user) return;
    applySchoolChanges(result);
    save(userKey("schoolUndo"),undo?null:invertSchoolChanges(batch,result));
    onSaved();

function parseSchoolOutline(source){
  const entries=[];
  for(const part of source.normalize("NFKC").split(/[\n;,]/)){
    const segments=part.split("%").slice(0,-1);
    for(const segment of segments){
      const match=/(?<![\d.])(-?\d+(?:\.\d+)?)\s*$/.exec(segment);
      if(!match) continue;
      const category=segment.slice(0,match.index).replace(/^[\s|*•–—-]+|[\s|*:：=–—]+$/g,"");
      if(!category) continue;
      entries.push({category:schoolName(category,"大纲类别"),weight:schoolWeight(Number(match[1]))});
    }
  }
  if(!entries.length) throw new Error("没识别出类别和百分比。可用「Labs 30%」格式。");
  validateSchoolOutline(entries);
  return entries;
}
function validateSchoolOutline(entries){
  const keys=entries.map(row=>schoolKey(row.category));
  if(new Set(keys).size!==keys.length) throw new Error("同一门课的大纲类别不能重复。");
  if(entries.reduce((sum,row)=>sum+row.weight,0)>100+1e-8) throw new Error("同一门课的大纲权重合计不能超过 100%。");
}
function schoolOutlineChanges(course,before,after,remove=false){
  const previous=new Map(before.map(row=>[schoolKey(row.category),row]));
  const next=new Map(after.map(row=>[schoolKey(row.category),row]));
  const changes=after.flatMap(row=>{
    const old=previous.get(schoolKey(row.category));
    return schoolSame(old?.weight,row.weight)?[]:[{course:old?.course??course,
      category:old?.category??row.category,before:old?Number(old.weight):null,after:row.weight}];
  });
  if(remove) for(const [key,row] of previous) if(!next.has(key)){
    changes.push({course:row.course??course,category:row.category,before:Number(row.weight),after:null});
  }
  return changes;
}

const SCHOOL_DATE_ONLY=/^\d{4}-\d\d-\d\d$/;
function schoolImportDate(value){
  if(value==null) return null;
  if(typeof value==="string"&&SCHOOL_DATE_ONLY.test(value)) value+="T23:59";
  const match=typeof value==="string"&&/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d)(?:\.\d{1,3})?)?(Z|[+-]\d\d:\d\d)?$/.exec(value);
  if(!match) throw new Error("截止时间须使用 ISO 日期时间格式。");
  const [,y,m,d,h,min,sec="00",zone]=match;
  const calendar=new Date(`${y}-${m}-${d}T00:00:00Z`);
  const parsed=new Date(value);
  if(+y<1||!Number.isFinite(+calendar)||calendar.toISOString().slice(0,10)!==`${y}-${m}-${d}`||
    +h>23||+min>59||+sec>59||!Number.isFinite(+parsed)||
    (!zone&&(parsed.getHours()!==+h||parsed.getMinutes()!==+min))) throw new Error("截止时间无效或在夏令时跳过的时段。");
  return parsed.toISOString();
}
function schoolImportList(value,label){
  if(!Array.isArray(value)) throw new Error(label+"须为数组。");
  return value;
}
function schoolImportObject(value,label){
  if(!value||typeof value!=="object"||Array.isArray(value)) throw new Error(label+"须为对象。");
  return value;
}
const schoolMatchKey=title=>schoolKey(schoolItemTitle({title})).replace(/[^\p{L}\p{N}]/gu,"");
function schoolTitleDistance(left,right,limit){
  if(Math.abs(left.length-right.length)>limit) return Infinity;
  let row=Array.from({length:right.length+1},(_,i)=>i);
  for(let i=1;i<=left.length;i++){
    const next=[i];
    for(let j=1;j<=right.length;j++) next[j]=Math.min(row[j]+1,next[j-1]+1,row[j-1]+(left[i-1]===right[j-1]?0:1));
    if(Math.min(...next)>limit) return Infinity;
    row=next;
  }
  return row[right.length];
}
function schoolMatchAssignment(title,due,candidates,dateOnly=false){
  const key=schoolMatchKey(title);
  const rank=candidates.flatMap(t=>{
    const candidate=schoolMatchKey(t.title), shorter=Math.min(candidate.length,key.length);
    if(!key||!candidate) return [];
    if(candidate===key) return [{t,rank:0}];
    const digits=value=>(value.match(/\d+/g)||[]).join(",");
    if(shorter<4||digits(candidate)!==digits(key)) return [];
    if(candidate.includes(key)||key.includes(candidate)) return [{t,rank:1}];
    const limit=Math.min(2,Math.floor(shorter/5));
    if(limit&&schoolTitleDistance(candidate,key,limit)<=limit) return [{t,rank:2}];
    return [];
  });
  if(!rank.length) return null;
  const best=Math.min(...rank.map(row=>row.rank));
  const matches=rank.filter(row=>row.rank===best);
  if(matches.length===1) return matches[0].t;
  const sameDate=due&&matches.filter(({t})=>t.due_at&&(dateOnly?ymd(new Date(t.due_at))===ymd(new Date(due)):
    Date.parse(t.due_at)===Date.parse(due)));
  if(sameDate?.length===1) return sameDate[0].t;
  throw new Error("有多份相似作业。请提供准确标题或对应的截止时间。");
}
function schoolImportAssignments(value){
  const assignments=schoolImportList(value??[],"assignments");
  const unique=new Map();
  for(const row of assignments){
    schoolImportObject(row,"作业");
    const title=schoolName(row.title,"作业标题",300);
    const key=JSON.stringify([schoolKey(title),row.due??null]);
    const previous=unique.get(key);
    if(!previous){
      unique.set(key,{input:{...row},title,duplicates:0});
      continue;
    }
    for(const field of ["category","weight","submitted","score","score_max"]){
      const old=previous.input[field], incoming=row[field];
      if(old!=null&&incoming!=null&&old!==incoming) throw new Error(title+" 有同名记录，"+field+" 值冲突。");
      if(incoming!=null||(old==null&&Object.hasOwn(row,field))) previous.input[field]=incoming;
    }
    previous.duplicates++;
  }
  return [...unique.values()];
}
function schoolImportPlan(source){
  requireSchoolOutline();
  if(source.length>200000) throw new Error("JSON 太长，请按课程分批导入。");
  let data;
  try{data=JSON.parse(source);}catch(error){throw new Error("JSON 格式无效，请核对括号、逗号和引号。");}
  const courses=schoolImportList(schoolImportObject(data,"JSON").courses,"courses");
  const batch={tasks:[],outline:[]}, preview=[], courseKeys=new Set(), taskIds=new Set(), newKeys=new Set();
  const all=schoolTasks(), submittedAt=new Date().toISOString();
  let count=0;
  for(const entry of courses){
    schoolImportObject(entry,"课程");
    const course=schoolCourseName(schoolName(entry.course,"课程")), courseKey=schoolKey(course);
    if(courseKeys.has(courseKey)) throw new Error("JSON 包含重复课程 "+course+"。");
    courseKeys.add(courseKey);
    const outline=schoolOutline(course), merged=new Map(outline.map(row=>[schoolKey(row.category),{...row,weight:Number(row.weight)}]));
    const importedOutline=schoolImportList(entry.outline??[],"outline").map(row=>{
      if(++count>1000) throw new Error("单次最多预览 1000 项，请分批导入。");
      schoolImportObject(row,"大纲行");
      return {category:schoolName(row.category,"大纲类别"),weight:schoolWeight(row.weight)};
    });
    validateSchoolOutline(importedOutline);
    for(const row of importedOutline) merged.set(schoolKey(row.category),row);
    validateSchoolOutline([...merged.values()]);
    const outlineChanges=schoolOutlineChanges(course,outline,importedOutline);
    batch.outline.push(...outlineChanges);
    for(const row of outlineChanges) preview.push({course,title:row.category,kind:"outline",before:row.before,after:row.after});
    const candidates=all.filter(t=>schoolKey(schoolCourse(t))===courseKey);

    for(const {input,title,duplicates} of schoolImportAssignments(entry.assignments)){
      count+=1+duplicates;
      if(count>1000) throw new Error("单次最多预览 1000 项，请分批导入。");
      try{
        const due=schoolImportDate(input.due), dateOnly=SCHOOL_DATE_ONLY.test(input.due);
        const match=schoolMatchAssignment(title,due,candidates,dateOnly);
        if(match&&taskIds.has(match.id)) throw new Error("多条导入记录匹配了同一份现有作业。");
        const id=match?.id||crypto.randomUUID();
        taskIds.add(id);
        const fields=schoolFieldValues(match);
        const after={...fields};
        if(!match) after.school_course=course;
        if(Object.hasOwn(input,"category")){
          const category=input.category===null?null:schoolName(input.category,"评分类别");
          after.grade_category=category?merged.get(schoolKey(category))?.category??category:null;
        }
        if(Object.hasOwn(input,"weight")) after.grade_weight=input.weight===null?null:schoolWeight(input.weight);
        if(input.submitted!=null){
          if(typeof input.submitted!=="boolean") throw new Error("submitted 须为 true、false 或 null。");
          after.submitted_at=input.submitted?fields.submitted_at||submittedAt:null;
        }
        if(Object.hasOwn(input,"score")) Object.assign(after,schoolScore(input.score,input.score_max));
        else if(Object.hasOwn(input,"score_max")) throw new Error("score_max 须与 score 一起提供。");
        const patch=match?schoolTaskPatch(id,fields,after):{id,before:fields,after};
        if(!match){
          const identity=JSON.stringify([courseKey,schoolKey(title),due]);
          if(newKeys.has(identity)) throw new Error("JSON 包含重复作业。");
          newKeys.add(identity);
          patch.create={title,due_at:due,key:identity};
        }
        if(patch) batch.tasks.push(patch);
        preview.push({course,title,matched:match?.title,kind:match?patch?"update":"same":"create",
          due:match?.due_at??(match?null:due),inputDue:due,dateOnly,duplicates,before:match?fields:null,after});
      }catch(error){throw new Error(course+" · "+title+" — "+error.message);}
    }
  }
  return {batch,preview};
}

function schoolImportPreview(row){

    大纲 ${row.before==null?"新增":schoolPercent(row.before)+" →"} ${schoolPercent(row.after)}</div></li>`;
  const previous=row.before, next=row.after;
  const details=[];

  const weightLabel=value=>value==null?"未设":schoolPercent(value);
  const categoryLabel=value=>value||"未分类";
  const detail=(field,label,format)=>{

    else if(!schoolSame(previous[field],next[field])) details.push(label+format(previous[field])+" → "+format(next[field]));

}

function schoolAction(action,el){
  const value=el.dataset.v;
  if(action==="school-import") return schoolImportSheet();
  if(action==="school-edit") return schoolEdit(schoolTasks().find(t=>t.id===el.dataset.id));
  if(action==="school-outline") return schoolOutlineSheet(value);
  if(action==="school-undo") return schoolUndo();
  if(action==="school-retry") return retrySchoolOutlines(el);
  if(action==="school-overdue"){
    save(userKey("schoolFilter"),{...schoolFilter(),state:"late",q:"",course:""});
    return changeView("school");
  }
  const filter=schoolFilter();
  if(action==="school-hide"){
    filter.hideSubmitted=!filter.hideSubmitted;
    if(filter.hideSubmitted&&filter.state==="submitted") filter.state="all";
  }else if(action==="school-filter"){
    filter.state=value;
    if(value==="submitted") filter.hideSubmitted=false;
  }else return;
  save(userKey("schoolFilter"),filter);render();
}
async function retrySchoolOutlines(button){
  if(!beginWrite()) return;
  const user=S.user;

  }catch(error){
    if(S.user===user) toast("课程大纲仍未读到，请稍后再试。");
  }finally{button.disabled=false;S.busy=false;}
}

function extensionConflicts(session,end,events){
  const extensionStart=new Date(Math.max(Date.now(),Date.parse(session.started_at)+session.planned_min*60000));
  const firstDay=ymd(extensionStart), lastDay=ymd(end);
  const names=[];
  for(let day=firstDay;day<=lastDay;day=addDays(day,1)){
    const from=day===firstDay?wallMinutes(extensionStart):0;
    const to=day===lastDay?Math.ceil(wallMinutes(end)+(end.getSeconds()+end.getMilliseconds()/1000)/60):1440;
    if(to<=from) continue;
    const tasks=S.tasks.filter(t=>availableTask(t)&&t.id!==session.task_id&&t.plan_date===day);
    for(const task of tasks){
      const start=hm(task.plan_start);
      if(start!=null&&start<to&&start+taskMinutes(task)>from) names.push(task.title);
    }
    for(const event of events){
      if(eventOn(event,day)&&hm(event.start_time)<to&&hm(event.end_time)>from) names.push(event.title);
    }
    const remaining=tasks.filter(t=>!t.plan_start).sort(taskOrder);
    if(!remaining.length) continue;
    const free=freeSlots(day,events,S.tasks,S.settings);
    const before=free.map(([start,stop])=>[Math.max(start,from),stop]).filter(([start,stop])=>stop>start);
    const after=free.map(([start,stop])=>[Math.max(start,to),stop]).filter(([start,stop])=>stop>start);
    for(const task of remaining){
      const fitsBefore=reserveSlot(before,taskMinutes(task))!==null;
      const fitsAfter=reserveSlot(after,taskMinutes(task))!==null;
      if(fitsBefore&&!fitsAfter) names.push(task.title);
    }
  }
  return [...new Set(names)];
}

function replanSheet(){

  let used=open.reduce((sum,t)=>sum+(dueToday(t)?t.est_min||30:0),0);
  const plan=open.map(t=>{ const m=t.est_min||30, fixed=dueToday(t);
    if(fixed) return {t,keep:true,fixed};

    b.onclick=()=>{ if(S.busy) return; p.keep=!p.keep; b.querySelector("[data-lab]").textContent=p.keep?"今天做":"挪到明天";
      draft[p.t.id]=p.keep; save(key,draft); }; });
  $("#rp-go").onclick=async()=>{ if(!beginWrite()) return;
    const go=$("#rp-go"); go.disabled=true;
    try{
      const move=plan.filter(p=>!p.keep).map(p=>p.t.id);

function matchingRules(now){
  const location=load(userKey("recommendationPlace"),""), minute=wallMinutes(now);
  return S.rules.filter(r=>{

function bindCatalogForm(form,key,draft,fields,paint,submit){
  const inputs=[...form.querySelectorAll("input,select,textarea,button")];
  const keep=()=>{
    for(const [name,id] of Object.entries(fields)) draft[name]=$("#"+id).value;
    save(key,draft);paint?.();
  };
  form.oninput=form.onchange=keep;
  form.onsubmit=async ev=>{
    ev.preventDefault();if(S.busy) return;
    keep();
    const data=submit.data(draft);
    if(typeof data==="string"){submit.error.textContent=data;return;}
    if(!beginWrite()) return;
    inputs.forEach(input=>input.disabled=true);
    try{
      await submit.write(data);
      save(key,null);closeSheet();render();toast(submit.message);
    }catch(e){submit.error.textContent="没保存上，请重试。";}
    finally{inputs.forEach(input=>input.disabled=false);S.busy=false;}
  };
  return keep;
}
